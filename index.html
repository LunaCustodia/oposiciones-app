                          <table className="w-full text-left border-collapse text-xs">
                            <thead>
                              <tr className="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-500 font-semibold">
                                <th className="p-3">Fecha y Hora</th>
                                <th className="p-3 text-center">Aciertos</th>
                                <th className="p-3 text-center">Fallos</th>
                                <th className="p-3 text-center">Blancos</th>
                                <th className="p-3 text-center">Nota Neta</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                              {historialSimulacros.map(h => (
                                <tr key={h.id}>
                                  <td className="p-3 font-semibold text-slate-800 dark:text-slate-200">
                                    {new Date(h.created_at).toLocaleString()}
                                  </td>
                                  <td className="p-3 text-center text-emerald-600 font-bold">{h.aciertos}</td>
                                  <td className="p-3 text-center text-rose-500 font-bold">{h.fallos}</td>
                                  <td className="p-3 text-center text-slate-400">{h.blancos}</td>
                                  <td className="p-3 text-center text-[#0F6252] dark:text-emerald-400 font-extrabold text-sm">
                                    {h.puntuacion_neta} / {h.total_preguntas}
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </>
                    )}
                  </div>
                )}

                {moduloActivo === "ayuda" && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white">Manual y Atajos de Teclado</h2>
                      <p className="text-xs text-slate-500">Instrucciones para responder a alta velocidad y criterios de puntuación.</p>
                    </div>

                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl space-y-4">
                      <h4 className="font-bold text-xs text-[#0F6252] dark:text-emerald-400">ATAJOS DE TECLADO EN ESCRITORIO</h4>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[A], [B], [C], [D]</span>: Marcar opción
                        </div>
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[D]</span>: Marcar duda
                        </div>
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[E]</span>: Abrir evidencia
                        </div>
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[←] / [→]</span>: Cambiar pregunta
                        </div>
                      </div>

                      <h4 className="font-bold text-xs text-[#0F6252] dark:text-emerald-400 pt-2">FÓRMULA DE PUNTUACIÓN</h4>
                      <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed font-medium">
                        Puntuación Neta = Aciertos - (Fallos × 0,33). Las preguntas dejadas en blanco no restan puntuación.
                      </p>
                    </div>
                  </div>
                )}

              </div>
            </main>

            {examenParaConfigurar && (
              <div className="fixed inset-0 z-[60] bg-slate-950/70 backdrop-blur-sm overflow-y-auto p-3 sm:p-6 flex items-start sm:items-center justify-center">
                <div role="dialog" aria-modal="true" aria-labelledby="titulo-config-test" className="my-auto w-full max-w-lg max-h-[calc(100dvh-1.5rem)] sm:max-h-[calc(100dvh-3rem)] overflow-y-auto bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-2xl shadow-2xl">
                  <form onSubmit={iniciarTestConfigurado} className="p-4 sm:p-6 space-y-5">
                    <div className="flex items-start justify-between gap-3">
                      <div className="min-w-0">
                        <p className="text-[10px] font-bold tracking-wider text-[#0F6252] dark:text-emerald-400 uppercase">Configurar test</p>
                        <h2 id="titulo-config-test" className="text-lg font-extrabold text-slate-900 dark:text-white leading-tight mt-1">{examenParaConfigurar.titulo}</h2>
                        <p className="text-xs text-slate-500 mt-1">{examenParaConfigurar.totalDisponible} preguntas disponibles</p>
                      </div>
                      <button type="button" onClick={() => setExamenParaConfigurar(null)} className="w-9 h-9 shrink-0 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300" aria-label="Cerrar configuración">✕</button>
                    </div>

                    <div>
                      <label htmlFor="cantidad-test" className="block text-xs font-bold text-slate-700 dark:text-slate-200 mb-1.5">Número de preguntas</label>
                      <input
                        id="cantidad-test"
                        type="number"
                        min="1"
                        max={examenParaConfigurar.totalDisponible}
                        step="1"
                        required
                        value={configTest.cantidad}
                        onChange={(e) => setConfigTest(prev => ({ ...prev, cantidad: e.target.value }))}
                        className="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white outline-none focus:border-[#0F6252]"
                      />
                      <p className="text-[11px] text-slate-500 mt-1">Elige cualquier entero entre 1 y {examenParaConfigurar.totalDisponible}.</p>
                    </div>

                    <fieldset>
                      <legend className="text-xs font-bold text-slate-700 dark:text-slate-200 mb-2">Modo</legend>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <label className={`p-3 rounded-xl border cursor-pointer ${configTest.modo === 'practica' ? 'border-[#0F6252] bg-[#EBF7F4] dark:bg-[#0F6252]/20' : 'border-slate-200 dark:border-slate-700'}`}>
                          <span className="flex items-center gap-2 text-xs font-bold text-slate-900 dark:text-white">
                            <input type="radio" name="modo-test" value="practica" checked={configTest.modo === 'practica'} onChange={(e) => setConfigTest(prev => ({ ...prev, modo: e.target.value }))} />
                            Práctica
                          </span>
                          <span className="block text-[11px] text-slate-500 mt-1 ml-5">Sin límite; cronómetro ascendente.</span>
                        </label>
                        <label className={`p-3 rounded-xl border cursor-pointer ${configTest.modo === 'simulacro' ? 'border-[#0F6252] bg-[#EBF7F4] dark:bg-[#0F6252]/20' : 'border-slate-200 dark:border-slate-700'}`}>
                          <span className="flex items-center gap-2 text-xs font-bold text-slate-900 dark:text-white">
                            <input type="radio" name="modo-test" value="simulacro" checked={configTest.modo === 'simulacro'} onChange={(e) => setConfigTest(prev => ({ ...prev, modo: e.target.value }))} />
                            Simulacro
                          </span>
                          <span className="block text-[11px] text-slate-500 mt-1 ml-5">Cuenta atrás y corrección automática.</span>
                        </label>
                      </div>
                    </fieldset>

                    {configTest.modo === 'simulacro' && (
                      <div>
                        <label htmlFor="duracion-test" className="block text-xs font-bold text-slate-700 dark:text-slate-200 mb-1.5">Duración en minutos</label>
                        <input
                          id="duracion-test"
                          type="number"
                          min="0.01"
                          step="any"
                          inputMode="decimal"
                          required
                          value={configTest.duracionMinutos}
                          onChange={(e) => setConfigTest(prev => ({ ...prev, duracionMinutos: e.target.value }))}
                          className="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white outline-none focus:border-[#0F6252]"
                        />
                      </div>
                    )}

                    <fieldset>
                      <legend className="text-xs font-bold text-slate-700 dark:text-slate-200 mb-2">Penalización</legend>
                      <div className="space-y-2">
                        <label className="flex items-center gap-2 text-xs text-slate-700 dark:text-slate-200">
                          <input type="radio" name="penalizacion-test" checked={!configTest.conPenalizacion} onChange={() => setConfigTest(prev => ({ ...prev, conPenalizacion: false }))} />
                          Sin penalización
                        </label>
                        <label className="flex items-center gap-2 text-xs text-slate-700 dark:text-slate-200">
                          <input type="radio" name="penalizacion-test" checked={configTest.conPenalizacion} onChange={() => setConfigTest(prev => ({ ...prev, conPenalizacion: true }))} />
                          Con penalización
                        </label>
                        {configTest.conPenalizacion && (
                          <div className="pl-0 sm:pl-6">
                            <label htmlFor="valor-penalizacion-test" className="block text-[11px] font-semibold text-slate-600 dark:text-slate-300 mb-1">Cuánto resta cada error</label>
                            <input
                              id="valor-penalizacion-test"
                              type="number"
                              min="0"
                              step="any"
                              inputMode="decimal"
                              required
                              value={configTest.penalizacion}
                              onChange={(e) => setConfigTest(prev => ({ ...prev, penalizacion: e.target.value }))}
                              className="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-950 px-3.5 py-2.5 text-sm text-slate-900 dark:text-white outline-none focus:border-[#0F6252]"
                            />
                          </div>
                        )}
                      </div>
                      <p className="text-[11px] text-slate-500 mt-2">Resultado neto = aciertos − (errores × penalización). Las preguntas en blanco no restan.</p>
                    </fieldset>

                    {errorConfigTest && (
                      <div role="alert" className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-xs font-semibold text-rose-700 dark:text-rose-300">
                        {errorConfigTest}
                      </div>
                    )}

                    <div className="flex flex-col-reverse sm:flex-row sm:justify-end gap-2 pt-1">
                      <button type="button" onClick={() => setExamenParaConfigurar(null)} className="w-full sm:w-auto px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-bold text-slate-600 dark:text-slate-300">Cancelar</button>
                      <button type="submit" disabled={iniciandoTest} className="w-full sm:w-auto px-5 py-2.5 rounded-xl bg-[#0F6252] hover:bg-[#0c4d40] disabled:opacity-60 text-white text-xs font-bold">
                        {iniciandoTest ? 'Preparando…' : 'Iniciar test'}
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
