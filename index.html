<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Archivo & Biblioteca — Tu espacio de estudio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef8f5',
              100: '#d7efe7',
              200: '#b2dfd2',
              500: '#17836d',
              700: '#0f6252',
              800: '#0c4d40',
              900: '#08382f'
            }
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased select-none dark:bg-slate-950 dark:text-slate-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // BANCO DEMO INICIAL CON FUENTES
    const BANCO_DEMO = [
      {
        id: "p1",
        origen: "oficial",
        numero_orden: 1,
        enunciado: "¿Cuál es el plazo para interponer recurso potestativo de reposición si el acto administrativo fuera expreso según la Ley 39/2015?",
        evidencia_texto: "Art. 124.1 Ley 39/2015: El plazo para la interposición del recurso de reposición será de un mes, si el acto fuera expreso. Transcurrido dicho plazo, únicamente podrá interponerse recurso contencioso-administrativo.",
        opciones: [
          { id: "o1", letra: "A", texto: "Un mes a contar desde el día siguiente a la notificación o publicación.", es_correcta: true },
          { id: "o2", letra: "B", texto: "Dos meses a contar desde el día siguiente a la notificación.", es_correcta: false },
          { id: "o3", letra: "C", texto: "Tres meses en caso de actos presuntos y expresos.", es_correcta: false },
          { id: "o4", letra: "D", texto: "Quince días hábiles improrrogables.", es_correcta: false }
        ]
      },
      {
        id: "p2",
        origen: "temario",
        tema: "Tema 14",
        numero_orden: 2,
        enunciado: "Según el principio archivístico de procedencia o respeto al origen de los fondos:",
        evidencia_texto: "Tema 14 Archivos: Los documentos producidos por una institución u organismo no deben mezclarse con los producidos por otra.",
        opciones: [
          { id: "o5", letra: "A", texto: "Los expedientes deben clasificarse por orden cronológico estricto independientemente del productor.", es_correcta: false },
          { id: "o6", letra: "B", texto: "Los documentos de cada fondo deben mantenerse agrupados sin mezclarse con otros.", es_correcta: true },
          { id: "o7", letra: "C", texto: "Los documentos históricos pasan directamente a expurgo a los 10 años.", es_correcta: false },
          { id: "o8", letra: "D", texto: "Solo se aplica a la documentación generada en soporte papel.", es_correcta: false }
        ]
      }
    ];

    function App() {
      // Estado de Autenticación
      const [autenticado, setAutenticado] = useState(() => localStorage.getItem("auth_session") === "true");
      const [emailInput, setEmailInput] = useState(() => localStorage.getItem("auth_email") || "lolixi@icloud.com");
      const [passwordInput, setPasswordInput] = useState("");
      const [errorLogin, setErrorLogin] = useState("");

      // Módulo activo
      const [moduloActivo, setModuloActivo] = useState("inicio"); // inicio, oficiales, temario, leyes, otros, errores, resultados, materiales
      const [modoOscuro, setModoOscuro] = useState(false);

      // Sala de examen activa
      const [examenActivo, setExamenActivo] = useState(false);
      const [preguntasTest, setPreguntasTest] = useState(BANCO_DEMO);
      const [indicePregunta, setIndicePregunta] = useState(0);
      const [respuestas, setRespuestas] = useState({});
      const [segundos, setSegundos] = useState(3600);
      const [mostrarEvidencia, setMostrarEvidencia] = useState(false);
      const [examenCorregido, setExamenCorregido] = useState(false);

      // Gestión de tema oscuro
      useEffect(() => {
        if (modoOscuro) document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      }, [modoOscuro]);

      // Control de acceso
      const handleLogin = (e) => {
        e.preventDefault();
        if (!passwordInput.trim()) {
          setErrorLogin("Introduce tu contraseña de acceso.");
          return;
        }
        setAutenticado(true);
        localStorage.setItem("auth_session", "true");
        localStorage.setItem("auth_email", emailInput);
        setErrorLogin("");
      };

      const handleLogout = () => {
        setAutenticado(false);
        localStorage.removeItem("auth_session");
        setExamenActivo(false);
      };

      // Iniciar test con filtro
      const iniciarTest = (filtroTipo) => {
        let filtradas = BANCO_DEMO;
        if (filtroTipo !== "todos") {
          filtradas = BANCO_DEMO.filter(p => p.origen === filtroTipo);
        }
        setPreguntasTest(filtradas.length > 0 ? filtradas : BANCO_DEMO);
        setIndicePregunta(0);
        setRespuestas({});
        setSegundos(3600);
        setExamenCorregido(false);
        setExamenActivo(true);
      };

      // ----------------------------------------------------------------------
      // VISTA 1: ACCESO PRIVADO (Login de la Captura 1)
      // ----------------------------------------------------------------------
      if (!autenticado) {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
            <div className="w-full max-w-[390px] bg-white rounded-3xl p-7 shadow-sm border border-slate-200/80">
              
              <div className="inline-block px-3 py-1 rounded-full bg-[#E5F5F0] text-[#0F6252] font-mono text-[11px] font-bold tracking-wider mb-5">
                ACCESO PRIVADO
              </div>

              <h1 className="text-2xl font-black text-slate-900 tracking-tight">OposiTest</h1>
              <p className="text-xs text-slate-500 font-medium mt-1 mb-6">
                Ayudante de Archivo y Biblioteca · OEP 2023
              </p>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-800 mb-1.5">Correo electrónico</label>
                  <input
                    type="email"
                    value={emailInput}
                    onChange={(e) => setEmailInput(e.target.value)}
                    required
                    className="w-full bg-[#EEF4FF] border border-[#D5E2FF] focus:border-[#E59833] focus:ring-2 focus:ring-[#E59833]/30 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 outline-none transition"
                  />
                </div>

                <div>
                  <label className="block text-xs font-semibold text-slate-800 mb-1.5">Contraseña</label>
                  <input
                    type="password"
                    placeholder="••••••••••••"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    required
                    className="w-full bg-[#EEF4FF] border border-[#D5E2FF] focus:border-[#0F6252] focus:ring-2 focus:ring-[#0F6252]/20 rounded-xl px-3.5 py-2.5 text-xs text-slate-900 outline-none transition"
                  />
                </div>

                {errorLogin && (
                  <p className="text-[11px] text-rose-600 font-medium">{errorLogin}</p>
                )}

                <button
                  type="submit"
                  className="w-full bg-[#0F6252] hover:bg-[#0c4d40] text-white font-bold text-xs py-3 rounded-xl transition shadow-xs mt-2"
                >
                  Entrar
                </button>
              </form>

              <div className="text-center mt-6">
                <button
                  onClick={() => alert("Restablecimiento no configurado. Acceso exclusivo local.")}
                  className="text-xs font-semibold text-[#0F6252] hover:underline"
                >
                  He olvidado mi contraseña
                </button>
              </div>
            </div>
          </div>
        );
      }

      // ----------------------------------------------------------------------
      // VISTA 2: SALA DE EXAMEN COMPACTA
      // ----------------------------------------------------------------------
      if (examenActivo) {
        const p = preguntasTest[indicePregunta] || preguntasTest[0];
        const resp = respuestas[p?.id];

        const responder = (opId, letra) => {
          if (examenCorregido) return;
          const esMisma = resp?.opcion_id === opId;
          setRespuestas(prev => ({
            ...prev,
            [p.id]: { opcion_id: esMisma ? null : opId, letra: esMisma ? null : letra, dudosa: resp?.dudosa || false }
          }));
        };

        const toggleDuda = () => {
          setRespuestas(prev => ({
            ...prev,
            [p.id]: { ...resp, dudosa: !resp?.dudosa }
          }));
        };

        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
            <header className="h-11 bg-slate-950 border-b border-slate-800 px-4 flex items-center justify-between font-mono text-xs">
              <button 
                onClick={() => setExamenActivo(false)} 
                className="text-slate-400 hover:text-white flex items-center gap-1 font-semibold"
              >
                ← Salir al panel
              </button>
              <div className="flex items-center gap-3">
                <span className="font-bold text-slate-200">{Object.values(respuestas).filter(r => r.opcion_id).length}/{preguntasTest.length}</span>
                <span className="text-slate-600">|</span>
                <span className="text-amber-400">⚑ {Object.values(respuestas).filter(r => r.dudosa).length}</span>
              </div>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setMostrarEvidencia(v => !v)}
                  className="px-2 py-0.5 rounded border border-slate-800 bg-slate-900 text-[11px] text-slate-300"
                >
                  Evidencia [E]
                </button>
                <button
                  onClick={() => setExamenCorregido(true)}
                  className="px-2.5 py-1 rounded bg-[#0F6252] hover:bg-[#0c4d40] text-white font-bold text-[11px]"
                >
                  Finalizar
                </button>
              </div>
            </header>

            <main className="flex-1 max-w-3xl mx-auto w-full p-4 md:p-6 flex flex-col justify-between">
              <div className="space-y-3">
                <div className="flex justify-between items-center text-xs font-mono text-slate-400">
                  <span>PREGUNTA {p.numero_orden} DE {preguntasTest.length}</span>
                  <button onClick={toggleDuda} className="text-amber-400 hover:underline">
                    {resp?.dudosa ? '★ Dudosa marcada' : '☆ Marcar dudosa'}
                  </button>
                </div>
                <h2 className="text-sm md:text-base font-medium text-white leading-relaxed">{p.enunciado}</h2>
                <div className="space-y-2 pt-2">
                  {p.opciones.map(op => {
                    const sel = resp?.opcion_id === op.id;
                    let cls = 'border-slate-800 bg-slate-950/60 text-slate-300 hover:bg-slate-800/60';
                    if (examenCorregido) {
                      if (op.es_correcta) cls = 'border-emerald-500 bg-emerald-950/40 text-emerald-200 font-bold';
                      else if (sel) cls = 'border-rose-500 bg-rose-950/40 text-rose-200 line-through';
                    } else if (sel) {
                      cls = 'border-[#0F6252] bg-[#0F6252]/20 text-white font-semibold';
                    }

                    return (
                      <button
                        key={op.id}
                        onClick={() => responder(op.id, op.letra)}
                        className={`w-full text-left p-2.5 rounded-lg border text-xs flex items-start gap-2.5 transition ${cls}`}
                      >
                        <span className="font-mono font-bold px-1.5 py-0.5 bg-slate-800 rounded text-slate-400 text-[11px]">{op.letra}</span>
                        <span>{op.texto}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="pt-4 border-t border-slate-800 flex justify-between">
                <button
                  disabled={indicePregunta === 0}
                  onClick={() => setIndicePregunta(i => i - 1)}
                  className="px-3 py-1.5 rounded border border-slate-800 text-xs font-mono disabled:opacity-30"
                >
                  ← Anterior
                </button>
                <button
                  disabled={indicePregunta === preguntasTest.length - 1}
                  onClick={() => setIndicePregunta(i => i + 1)}
                  className="px-3 py-1.5 rounded border border-slate-800 text-xs font-mono disabled:opacity-30"
                >
                  Siguiente →
                </button>
              </div>
            </main>

            {mostrarEvidencia && (
              <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                <div className="bg-slate-950 border border-slate-800 max-w-lg w-full p-4 rounded-xl space-y-3">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span className="text-xs font-mono font-bold text-slate-300">EVIDENCIA OFICIAL P.{p.numero_orden}</span>
                    <button onClick={() => setMostrarEvidencia(false)} className="text-slate-400 font-mono">✕</button>
                  </div>
                  <p className="text-xs font-serif text-slate-200 leading-relaxed bg-slate-900 p-3 rounded border border-slate-800">
                    {p.evidencia_texto}
                  </p>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ----------------------------------------------------------------------
      // VISTA 3: DASHBOARD PRINCIPAL (Estructura de la Captura 2 con pestañas compactas)
      // ----------------------------------------------------------------------
      const navItems = [
        { id: "inicio", sigla: "IN", label: "Inicio", color: "bg-[#0F6252] text-white" },
        { id: "oficiales", sigla: "OF", label: "Exámenes oficiales", color: "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300" },
        { id: "temario", sigla: "MT", label: "Mi temario", color: "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300" },
        { id: "leyes", sigla: "LE", label: "Leyes y normas", color: "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300" },
        { id: "otros", sigla: "OT", label: "Otros exámenes", color: "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300" },
        { id: "errores", sigla: "RE", label: "Repasar errores", color: "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300" },
        { id: "resultados", sigla: "MR", label: "Mis resultados", color: "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300" },
        { id: "materiales", sigla: "MA", label: "Subir PDFs / Ingesta", color: "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300" },
        { id: "gestion", sigla: "GA", label: "Gestión avanzada", color: "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300" },
        { id: "ayuda", sigla: "AY", label: "Ayuda y manual", color: "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300" },
      ];

      return (
        <div className="min-h-screen flex bg-[#F8FAFB] dark:bg-slate-950 font-sans">
          
          {/* BARRA LATERAL IZQUIERDA (Estilo idéntico a Captura 2) */}
          <aside className="w-56 bg-white dark:bg-slate-900 border-r border-slate-200/90 dark:border-slate-800 flex flex-col shrink-0">
            {/* Cabecera Sidebar */}
            <div className="p-3.5 flex items-center gap-2.5 border-b border-slate-100 dark:border-slate-800/80">
              <div className="w-8 h-8 rounded-lg bg-[#0F6252] text-white flex items-center justify-center font-bold text-xs shrink-0">
                AB
              </div>
              <div className="leading-tight truncate">
                <div className="font-bold text-xs text-slate-900 dark:text-white truncate">Archivo & Biblioteca</div>
                <div className="text-[10px] text-slate-400 truncate">Tu espacio de estudio</div>
              </div>
            </div>

            {/* Lista de Módulos */}
            <nav className="flex-1 p-2 space-y-0.5 overflow-y-auto">
              {navItems.map(item => {
                const activo = moduloActivo === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setModuloActivo(item.id)}
                    className={`w-full flex items-center gap-2.5 px-2 py-1.5 rounded-lg text-xs font-medium transition text-left ${
                      activo
                        ? 'bg-[#EBF7F4] text-[#0F6252] font-semibold dark:bg-[#0F6252]/20 dark:text-emerald-300'
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100/80 dark:hover:bg-slate-800/60'
                    }`}
                  >
                    <span className={`w-6 h-6 rounded flex items-center justify-center font-mono text-[10px] font-bold shrink-0 ${
                      activo ? 'bg-[#0F6252] text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500'
                    }`}>
                      {item.sigla}
                    </span>
                    <span className="truncate">{item.label}</span>
                  </button>
                );
              })}
            </nav>
          </aside>

          {/* CONTENIDO PRINCIPAL */}
          <div className="flex-1 flex flex-col min-w-0">
            
            {/* Barra Superior Header */}
            <header className="h-12 bg-white dark:bg-slate-900 border-b border-slate-200/90 dark:border-slate-800 px-5 flex items-center justify-between shrink-0">
              <div className="text-xs text-slate-500 font-medium capitalize">
                {moduloActivo}
              </div>

              <div className="flex items-center gap-2 text-xs">
                <button 
                  onClick={() => setModuloActivo("resultados")}
                  className="px-2.5 py-1 text-slate-600 dark:text-slate-300 hover:text-slate-900 font-medium"
                >
                  Mis resultados
                </button>
                <button 
                  onClick={() => alert("Manual de ayuda: selecciona un tipo de test o sube exámenes en PDF.")}
                  className="px-2.5 py-1 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-1"
                >
                  <span>?</span> Ayuda
                </button>
                <button
                  onClick={() => setModoOscuro(!modoOscuro)}
                  className="px-2.5 py-1 border border-slate-200 dark:border-slate-700 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center gap-1"
                >
                  ◑ {modoOscuro ? 'Claro' : 'Oscuro'}
                </button>
                <button
                  onClick={handleLogout}
                  className="px-3 py-1 bg-[#102A43] hover:bg-slate-900 text-white rounded-lg font-medium flex items-center gap-1 ml-1"
                >
                  <span>↩</span> Salir
                </button>
              </div>
            </header>

            {/* Área Central: Dashboard */}
            <main className="flex-1 p-5 md:p-6 overflow-y-auto">
              <div className="max-w-5xl mx-auto space-y-4">
                
                <div>
                  <span className="font-mono text-[10px] font-bold text-[#0F6252] tracking-wider uppercase">INICIO</span>
                  <h1 className="text-xl md:text-2xl font-black text-slate-900 dark:text-white tracking-tight mt-0.5">
                    Tu espacio de estudio
                  </h1>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                    Selecciona una categoría de test para entrenar o repasa tus fallos acumulados.
                  </p>
                </div>

                {/* LOS 4 MÓDULOS DE EXAMEN (Diseño compacto sin espacios muertos) */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 pt-1">
                  
                  {/* Tarjeta 1: Oficiales */}
                  <div className="bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 rounded-xl p-3.5 flex flex-col justify-between hover:shadow-xs transition">
                    <div>
                      <div className="flex items-center justify-between mb-2.5">
                        <span className="w-7 h-7 rounded-lg bg-[#0F6252] text-white flex items-center justify-center font-bold text-xs font-mono">
                          OF
                        </span>
                        <span className="px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-[10px] font-semibold">
                          Tribunal Oficial
                        </span>
                      </div>
                      <h3 className="font-bold text-slate-900 dark:text-white text-xs mb-1">Exámenes oficiales</h3>
                      <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-snug line-clamp-2">
                        Exámenes reales de convocatorias con recortes de tribunal y soluciones publicadas.
                      </p>
                    </div>
                    <button
                      onClick={() => iniciarTest("oficiales")}
                      className="mt-3 w-full py-1.5 bg-[#0F6252] hover:bg-[#0c4d40] text-white text-xs font-semibold rounded-lg transition"
                    >
                      Practicar test →
                    </button>
                  </div>

                  {/* Tarjeta 2: Temario */}
                  <div className="bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 rounded-xl p-3.5 flex flex-col justify-between hover:shadow-xs transition">
                    <div>
                      <div className="flex items-center justify-between mb-2.5">
                        <span className="w-7 h-7 rounded-lg bg-[#3F51B5] text-white flex items-center justify-center font-bold text-xs font-mono">
                          MT
                        </span>
                        <span className="px-2 py-0.5 rounded-full bg-blue-50 dark:bg-blue-950/60 text-blue-700 dark:text-blue-300 text-[10px] font-semibold">
                          60 Temas
                        </span>
                      </div>
                      <h3 className="font-bold text-slate-900 dark:text-white text-xs mb-1">Mi temario</h3>
                      <p className="text-[11px] text-slate-500 dark:text-slate-400 leading-snug line-clamp-2">
                        12 temas comunes y 48 específicos con cita literal del párrafo del temario.
                      </p>
                    </div>
                    <button
                      onClick={() => iniciarTest("temario")}
                      className="mt-3 w-full py-1.5 bg-[#3F51B5] hover:bg-[#303f9f] text-white text-xs font-semibold rounded-lg transition"
                    >
                      Test por temas →
                    </button>
                  </div>

                  {/* Tarjeta 3: Leyes */}
                  <div className="bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 rounded-xl p-3.5 flex flex-col justify-between hover:shadow-xs transition">
                    <div>
                      <div className="flex items-center justify-between mb-2.5">
                        <span className="w-7 h-7 rounded-lg bg-[#E65100] text-white flex items-center justify-center font-bold text-xs font-mono">
                          LE
                        </span>
                        <span className="px-2 py-0.5 rounded-full bg-amber-50 dark:bg-amber-950/60 text-amber-700 dark:text-amber-300 text-[10px] font-semibold">
                          Legislación
