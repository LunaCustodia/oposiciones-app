      const [estadoServicioOcr, setEstadoServicioOcr] = useState({ status: "checking" });
      const [archivosPdf, setArchivosPdf] = useState([]);
      const [importacionOcr, setImportacionOcr] = useState(null);
      const [extraccionOcr, setExtraccionOcr] = useState(null);
      const [iniciandoExtraccionOcr, setIniciandoExtraccionOcr] = useState(false);
      const [interpretacionOcr, setInterpretacionOcr] = useState(null);
      const [iniciandoInterpretacionOcr, setIniciandoInterpretacionOcr] = useState(false);
      const [vinculacionOcr, setVinculacionOcr] = useState(null);
      const [iniciandoVinculacionOcr, setIniciandoVinculacionOcr] = useState(false);
      const [mostrarRevisionOcr, setMostrarRevisionOcr] = useState(false);
      const [cargandoImportacionOcr, setCargandoImportacionOcr] = useState(false);
      const [subiendoImportacionOcr, setSubiendoImportacionOcr] = useState(false);
      const [errorArchivosPdf, setErrorArchivosPdf] = useState("");
      const [progresoSubidaOcr, setProgresoSubidaOcr] = useState(0);
      const [procesandoVision, setProcesandoVision] = useState(false);
      const [mensajeEstado, setMensajeEstado] = useState("");
      const [preguntasExtraidas, setPreguntasExtraidas] = useState([]);
      const [resultadoImportacion, setResultadoImportacion] = useState(null);
      const [datosExamen, setDatosExamen] = useState({
        titulo: "",
        organismo: "",
        año: "",
        categoria: ""
      });
      const [guardandoEnSupabase, setGuardandoEnSupabase] = useState(false);

      useEffect(() => {
        localStorage.removeItem("gemini_api_key");
        localStorage.removeItem("auth_session");
        localStorage.removeItem("auth_email");

        const controller = new AbortController();
        const restaurarSesion = async () => {
          try {
            const respuesta = await fetch('/api/ocr/session', {
              credentials: 'same-origin',
              signal: controller.signal
            });
            const sesion = respuesta.ok ? await respuesta.json() : null;
            if (sesion?.authenticated === true && typeof sesion.csrf === 'string') {
              setCsrfToken(sesion.csrf);
              setAutenticado(true);
            }
          } catch (error) {
            if (error.name === 'AbortError') return;
          } finally {
            if (!controller.signal.aborted) setComprobandoSesion(false);
          }
        };
        restaurarSesion();
        return () => controller.abort();
      }, []);

      useEffect(() => {
        if (!autenticado) {
          setEstadoServicioOcr({ status: "pending_configuration" });
          return undefined;
        }

        const controller = new AbortController();
        const consultarDisponibilidad = async () => {
          try {
            const respuesta = await fetch('/api/ocr/availability', {
              credentials: 'same-origin',
              signal: controller.signal
            });
            if (!respuesta.ok) {
              setEstadoServicioOcr({ status: "pending_configuration" });
              return;
            }
            const disponibilidad = await respuesta.json();
            setEstadoServicioOcr({ status: disponibilidad.status });
          } catch (error) {
            if (error.name !== 'AbortError') {
              setEstadoServicioOcr({ status: "pending_configuration" });
            }
          }
        };
        consultarDisponibilidad();
        return () => controller.abort();
      }, [autenticado]);

      useEffect(() => {
        if (!autenticado) {
          setImportacionOcr(null);
          setExtraccionOcr(null);
          setInterpretacionOcr(null);
          setVinculacionOcr(null);
          setMostrarRevisionOcr(false);
          setCargandoImportacionOcr(false);
          return undefined;
        }

        const controller = new AbortController();
        const cargarImportacionActual = async () => {
          setCargandoImportacionOcr(true);
          try {
            const respuesta = await fetch('/api/ocr/imports', {
              credentials: 'same-origin',
              signal: controller.signal
            });
            if (!respuesta.ok) throw new Error('No se pudo recuperar la importación');
            const payload = await respuesta.json();
            setImportacionOcr(payload.import || null);
          } catch (error) {
            if (error.name !== 'AbortError') {
              setErrorArchivosPdf('No se pudo recuperar la importación guardada.');
            }
          } finally {
            if (!controller.signal.aborted) setCargandoImportacionOcr(false);
          }
        };
        cargarImportacionActual();
        return () => controller.abort();
      }, [autenticado]);

      useEffect(() => {
        const importId = importacionOcr?.id;
        if (!autenticado || !importId) {
          setExtraccionOcr(null);
          return undefined;
        }

        let cancelado = false;
        let temporizador = null;
        const consultarExtraccion = async () => {
          try {
            const respuesta = await fetch(`/api/ocr/imports/${encodeURIComponent(importId)}/extraction`, {
              credentials: 'same-origin'
            });
            if (!respuesta.ok) throw new Error('status_failed');
            const payload = await respuesta.json();
            if (cancelado) return;
            const estado = payload.extraction || null;
            setExtraccionOcr(estado);
            if (estado && (estado.state === 'pendiente' || estado.state === 'procesando')) {
              temporizador = window.setTimeout(consultarExtraccion, 2000);
            }
          } catch {
            if (!cancelado) setErrorArchivosPdf('No se pudo recuperar el estado de la extracción.');
          }
        };
        consultarExtraccion();
        return () => {
          cancelado = true;
          if (temporizador) window.clearTimeout(temporizador);
        };
      }, [autenticado, importacionOcr?.id, extraccionOcr?.state]);

      useEffect(() => {
        const importId = importacionOcr?.id;
        if (!autenticado || !importId || extraccionOcr?.state !== 'completado') {
          setInterpretacionOcr(null);
          return undefined;
        }
        let cancelado = false;
        let temporizador = null;
        const consultarInterpretacion = async () => {
          try {
            const respuesta = await fetch(`/api/ocr/imports/${encodeURIComponent(importId)}/interpretation`, { credentials: 'same-origin' });
            if (!respuesta.ok) throw new Error('status_failed');
            const payload = await respuesta.json();
            if (cancelado) return;
            const estado = payload.interpretation || null;
            setInterpretacionOcr(estado);
            if (estado && (estado.state === 'pendiente' || estado.state === 'procesando')) {
              temporizador = window.setTimeout(consultarInterpretacion, 2000);
            }
          } catch {
            if (!cancelado) setErrorArchivosPdf('No se pudo recuperar el estado de la interpretación.');
          }
        };
        consultarInterpretacion();
        return () => {
          cancelado = true;
          if (temporizador) window.clearTimeout(temporizador);
        };
      }, [autenticado, importacionOcr?.id, extraccionOcr?.state, interpretacionOcr?.state]);

      useEffect(() => {
        const importId = importacionOcr?.id;
        if (!autenticado || !importId || !['completado', 'revision'].includes(interpretacionOcr?.state)) {
          setVinculacionOcr(null);
          setMostrarRevisionOcr(false);
          return undefined;
        }
        let cancelado = false;
        let temporizador = null;
        const consultarVinculacion = async () => {
          try {
            const respuesta = await fetch(`/api/ocr/imports/${encodeURIComponent(importId)}/binding`, { credentials: 'same-origin' });
            if (!respuesta.ok) throw new Error('status_failed');
            const payload = await respuesta.json();
            if (cancelado) return;
            const estado = payload.binding || null;
            setVinculacionOcr(estado);
            if (estado && (estado.state === 'pendiente' || estado.state === 'procesando')) {
              temporizador = window.setTimeout(consultarVinculacion, 2000);
            }
          } catch {
            if (!cancelado) setErrorArchivosPdf('No se pudo recuperar el estado de la vinculación.');
          }
        };
        consultarVinculacion();
        return () => { cancelado = true; if (temporizador) window.clearTimeout(temporizador); };
      }, [autenticado, importacionOcr?.id, interpretacionOcr?.state, vinculacionOcr?.state]);

      const cerrarMenu = useCallback((devolverFoco = true) => {
        setMenuAbierto(false);
        if (devolverFoco) {
          requestAnimationFrame(() => botonMenuRef.current?.focus());
        }
      }, []);

      const alternarMenu = () => {
        if (menuAbierto) cerrarMenu();
        else setMenuAbierto(true);
      };

      const seleccionarApartado = (id) => {
        setModuloActivo(id);
        if (menuSuperpuesto) {
          cerrarMenu(false);
          requestAnimationFrame(() => contenidoPrincipalRef.current?.focus());
        }
      };

      const manejarTecladoMenu = (e) => {
        if (!menuSuperpuesto || e.key !== 'Tab' || !panelMenuRef.current) return;
        const elementos = Array.from(panelMenuRef.current.querySelectorAll(
          'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
        ));
        if (elementos.length === 0) return;

        const primero = elementos[0];
        const ultimo = elementos[elementos.length - 1];
        if (e.shiftKey && document.activeElement === primero) {
          e.preventDefault();
          ultimo.focus();
        } else if (!e.shiftKey && document.activeElement === ultimo) {
          e.preventDefault();
          primero.focus();
        }
      };

      useEffect(() => {
        const consultas = [
          window.matchMedia('(max-width: 899px)'),
          window.matchMedia('(max-width: 1366px)'),
          window.matchMedia('(pointer: coarse)'),
          window.matchMedia('(hover: none)')
        ];

        const actualizarTipoMenu = () => {
          const siguiente = detectarMenuSuperpuesto();
          if (menuSuperpuestoRef.current !== siguiente) {
            menuSuperpuestoRef.current = siguiente;
            setMenuSuperpuesto(siguiente);
            setMenuAbierto(!siguiente);
          }
        };

        consultas.forEach(consulta => consulta.addEventListener('change', actualizarTipoMenu));
        return () => consultas.forEach(consulta => consulta.removeEventListener('change', actualizarTipoMenu));
      }, []);

      useEffect(() => {
        if (!menuAbierto) return;

        const overflowAnterior = document.body.style.overflow;
        const manejarEscape = (e) => {
          if (e.key === 'Escape') cerrarMenu();
        };

        document.addEventListener('keydown', manejarEscape);
        if (menuSuperpuesto) {
          document.body.style.overflow = 'hidden';
          requestAnimationFrame(() => botonCerrarMenuRef.current?.focus());
        }

        return () => {
          if (menuSuperpuesto) document.body.style.overflow = overflowAnterior;
          document.removeEventListener('keydown', manejarEscape);
        };
      }, [menuSuperpuesto, menuAbierto, cerrarMenu]);

      useEffect(() => {
        if (modoOscuro) document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      }, [modoOscuro]);

      const recargarExamenes = useCallback(async () => {
        setCargandoExamenes(true);
        try {
          const listado = await ExamenService.obtenerExamenes();
          setExamenesBD(listado);
        } catch (e) {
          console.error("Error recargando exámenes:", e);
        } finally {
          setCargandoExamenes(false);
        }
      }, []);

      const recargarHistorialYFallos = useCallback(async () => {
        try {
          const hist = await ExamenService.obtenerHistorialExamenes();
          setHistorialSimulacros(hist);
          const fallos = await ExamenService.obtenerFallosPendientes();
          setFallosPendientes(fallos);
        } catch (e) {
          console.error("Error cargando historial:", e);
        }
      }, []);

      useEffect(() => {
        if (autenticado) {
          recargarExamenes();
          recargarHistorialYFallos();
        }
      }, [autenticado, recargarExamenes, recargarHistorialYFallos]);

      useEffect(() => {
        if (!examenActivo || !configuracionIntento.persistir || preguntasTest.length === 0) return;
        localStorage.setItem(CLAVE_INTENTO_OFICIAL, JSON.stringify({
          titulo: tituloExamenActivo,
          preguntas: preguntasTest,
          indicePregunta,
          respuestas,
          segundos,
          corregido: examenCorregido,
          configuracion: configuracionIntento
        }));
      }, [examenActivo, tituloExamenActivo, preguntasTest, indicePregunta, respuestas, segundos, examenCorregido, configuracionIntento]);

      const sincronizarArchivos = useCallback(async () => {
        if (!supabaseClient) return;
        setCargandoArchivos(true);

        const probarBucket = async (bName) => {
          try {
            const { data: com } = await supabaseClient.storage.from(bName).list('Comunes', { limit: 100 });
            const { data: esp } = await supabaseClient.storage.from(bName).list('Especificos', { limit: 100 });
            
            const comFiltrados = (com || []).filter(f => f.name && f.name !== '.emptyFolderPlaceholder');
            const espFiltrados = (esp || []).filter(f => f.name && f.name !== '.emptyFolderPlaceholder');

            if (comFiltrados.length > 0 || espFiltrados.length > 0) {
              setBucketActivo(bName);
              setArchivosComunes(comFiltrados);
              setArchivosEspecificos(espFiltrados);
              return true;
            }
          } catch (e) {
            console.error("Error comprobando bucket:", bName, e);
          }
          return false;
        };

        const exitoMayus = await probarBucket('Temario');
        if (!exitoMayus) {
          await probarBucket('temario');
        }

        setCargandoArchivos(false);
      }, []);

      useEffect(() => {
        if (autenticado) {
          sincronizarArchivos();
        }
      }, [autenticado, sincronizarArchivos]);

      const obtenerArchivoTema = useCallback((tema) => {
        const lista = tema.bloque === 'Común' ? archivosComunes : archivosEspecificos;
        const numPadded = String(tema.numero).padStart(2, '0');
        const numSingle = String(tema.numero);

        const coincidencia = lista.find(f => {
          const n = f.name.toLowerCase();
          return n.includes(`tema_${numPadded}`) || 
                 n.includes(`tema_${numSingle}_`) ||
                 n.includes(`tema ${numPadded}`) ||
                 n.includes(`tema${numPadded}`) ||
                 n.startsWith(`tema_${numPadded}`) ||
                 n.startsWith(`tema_${numSingle}_`);
        });

        return coincidencia ? coincidencia.name : null;
      }, [archivosComunes, archivosEspecificos]);

      const handleAbrirTema = async (tema) => {
        const nombre = obtenerArchivoTema(tema);
        const carpeta = tema.bloque === 'Común' ? 'Comunes' : 'Especificos';
        if (!nombre) {
          alert(`El PDF de ${tema.codigo} no se detecta en la carpeta ${carpeta}.`);
          return;
        }

        const url = `${SUPABASE_URL}/storage/v1/object/public/${bucketActivo}/${carpeta}/${encodeURIComponent(nombre)}`;
        const nuevaPestana = window.open('about:blank', '_blank');
        if (nuevaPestana) {
          nuevaPestana.document.title = `Cargando ${tema.codigo}...`;
          nuevaPestana.document.body.style.margin = '0';
          nuevaPestana.document.body.style.backgroundColor = '#0f172a';
          nuevaPestana.document.body.style.color = '#f8fafc';
          nuevaPestana.document.body.style.fontFamily = 'system-ui, -apple-system, sans-serif';
          nuevaPestana.document.body.style.display = 'flex';
          nuevaPestana.document.body.style.alignItems = 'center';
          nuevaPestana.document.body.style.justifyContent = 'center';
          nuevaPestana.document.body.style.height = '100vh';
          nuevaPestana.document.body.innerHTML = `
            <div style="text-align: center; max-width: 550px; padding: 24px;">
              <div style="font-size: 13px; font-weight: 700; color: #14b89a; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 8px;">${tema.codigo}</div>
              <div style="font-size: 16px; font-weight: 600; line-height: 1.4; margin-bottom: 20px;">${tema.titulo}</div>
              <div style="display: inline-flex; align-items: center; gap: 10px; font-size: 12px; color: #94a3b8; background: #1e293b; padding: 10px 20px; border-radius: 9999px;">
                <span style="display:inline-block; width:8px; height:8px; background:#14b89a; border-radius:50%;"></span>
                Abriendo en el visor oficial de lectura...
              </div>
            </div>
          `;
        }

        try {
          const resp = await fetch(url);
          if (!resp.ok) throw new Error("No se pudo obtener el archivo desde el almacén.");
          const buffer = await resp.arrayBuffer();
          const pdfBlob = new Blob([buffer], { type: 'application/pdf' });
          const blobUrl = URL.createObjectURL(pdfBlob);

          if (nuevaPestana && !nuevaPestana.closed) {
            nuevaPestana.document.title = `${tema.codigo} — ${tema.titulo}`;
            nuevaPestana.document.body.style.margin = '0';
            nuevaPestana.document.body.style.padding = '0';
            nuevaPestana.document.body.style.overflow = 'hidden';
            nuevaPestana.document.body.innerHTML = `
              <iframe 
                src="${blobUrl}" 
                style="width: 100vw; height: 100vh; border: none; margin: 0; padding: 0; display: block;"
                title="${tema.codigo} — ${tema.titulo}"
              ></iframe>
            `;
          }
        } catch (err) {
          console.error("Error abriendo PDF:", err);
          if (nuevaPestana && !nuevaPestana.closed) {
            nuevaPestana.document.body.innerHTML = `
              <div style="text-align: center; color: #f87171; font-family: sans-serif; padding: 40px;">
                <p style="font-weight: bold; font-size: 16px;">No se pudo mostrar el PDF en el visor.</p>
                <p style="font-size: 12px; color: #94a3b8; margin-bottom: 16px;">${err.message}</p>
                <a href="${url}" download="${nombre}" style="display: inline-block; padding: 10px 20px; background: #0F6252; color: white; text-decoration: none; border-radius: 8px; font-size: 12px; font-weight: bold;">
                  Descargar directamente
                </a>
              </div>
            `;
          }
        }
      };

      const handleDescargarTema = (tema) => {
        const nombre = obtenerArchivoTema(tema);
        const carpeta = tema.bloque === 'Común' ? 'Comunes' : 'Especificos';
        if (nombre) {
          const url = `${SUPABASE_URL}/storage/v1/object/public/${bucketActivo}/${carpeta}/${encodeURIComponent(nombre)}`;
          const a = document.createElement('a');
          a.href = url;
          a.download = nombre;
          a.target = '_blank';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        setAccediendo(true);
        setErrorAcceso("");
        setEstadoServicioOcr({ status: "checking" });
        try {
          const respuesta = await fetch('/api/ocr/session', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: emailInput, password: passwordInput })
          });
          if (!respuesta.ok) {
            if (respuesta.status === 401) throw new Error('Credenciales incorrectas.');
            if (respuesta.status === 429) throw new Error('Demasiados intentos. Inténtalo más tarde.');
            if (respuesta.status === 503) throw new Error('El acceso está pendiente de configuración en el servidor.');
            throw new Error('No se pudo validar el acceso.');
          }
          const sesion = await respuesta.json();
          if (sesion?.authenticated !== true || typeof sesion.csrf !== 'string') {
            throw new Error('No se pudo validar el acceso.');
          }
          setCsrfToken(sesion.csrf);
          setModuloActivo("inicio");
          setAutenticado(true);
          setPasswordInput("");
        } catch (error) {
          setEstadoServicioOcr({ status: "pending_configuration" });
          setAutenticado(false);
          setCsrfToken("");
          setPasswordInput("");
          setErrorAcceso(error.message || 'No se pudo validar el acceso.');
        } finally {
          setAccediendo(false);
        }
      };

      const handleLogout = async () => {
        try {
          const respuesta = await fetch('/api/ocr/session', {
            method: 'DELETE',
            credentials: 'same-origin',
            headers: { 'x-csrf-token': csrfToken }
          });
          if (!respuesta.ok && respuesta.status !== 401) throw new Error('logout_failed');
          setAutenticado(false);
          setCsrfToken("");
          setImportacionOcr(null);
          setExtraccionOcr(null);
          setArchivosPdf([]);
          setExamenActivo(false);
        } catch {
          alert('No se pudo cerrar la sesión en el servidor. Inténtalo de nuevo.');
        }
      };

      const claveArchivoPdf = (file) => `${file.name.toLowerCase()}|${file.size}|${file.lastModified}`;

      const agregarArchivosPdf = (event) => {
        const seleccionados = Array.from(event.target.files || []);
        const existentes = new Set(archivosPdf.map(item => item.id));
        const nuevos = [];
        let rechazados = 0;
        let duplicados = 0;
        seleccionados.forEach(file => {
          const esPdf = file.type === 'application/pdf' && file.name.toLowerCase().endsWith('.pdf');
          const id = claveArchivoPdf(file);
          if (!esPdf) {
            rechazados += 1;
          } else if (existentes.has(id)) {
            duplicados += 1;
          } else {
            existentes.add(id);
            nuevos.push({ id, file, tipo: 'auto' });
          }
        });
        if (nuevos.length > 0) setArchivosPdf(prev => [...prev, ...nuevos]);
        const avisos = [];
        if (rechazados) avisos.push(`${rechazados} archivo${rechazados === 1 ? '' : 's'} rechazado${rechazados === 1 ? '' : 's'}: solo se admiten PDF.`);
        if (duplicados) avisos.push(`${duplicados} archivo${duplicados === 1 ? '' : 's'} duplicado${duplicados === 1 ? '' : 's'} no se añadió.`);
        setErrorArchivosPdf(avisos.join(' '));
        setPreguntasExtraidas([]);
        setResultadoImportacion(null);
        setMensajeEstado('');
        event.target.value = '';
      };

      const actualizarTipoArchivo = (id, tipo) => {
        setArchivosPdf(prev => prev.map(item => item.id === id ? { ...item, tipo } : item));
        setErrorArchivosPdf('');
        setPreguntasExtraidas([]);
        setResultadoImportacion(null);
      };

      const quitarArchivoPdf = (id) => {
        setArchivosPdf(prev => prev.filter(item => item.id !== id));
        setErrorArchivosPdf('');
        setPreguntasExtraidas([]);
        setResultadoImportacion(null);
        setMensajeEstado('');
      };

      const etiquetasTipoArchivo = {
        auto: 'Detección automática',
        preguntas: 'Preguntas',
        respuestas: 'Plantilla o respuestas',
        mixto: 'Documento mixto',
        anexo: 'Anexo'
      };

      const formatearTamaño = (bytes) => {
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / 1024 / 1024).toFixed(2)} MB`;
      };

      const iniciarSubidaImportacion = async () => {
        if (archivosPdf.length === 0) {
          setErrorArchivosPdf('Selecciona al menos un PDF del examen.');
          return;
        }
        if (typeof window.uploadOcr02File !== 'function') {
          setErrorArchivosPdf('El componente de subida privada aún no está disponible. Recarga la página.');
          return;
        }

        setSubiendoImportacionOcr(true);
        setProgresoSubidaOcr(0);
        setErrorArchivosPdf('');
        setMensajeEstado('Creando la importación privada…');
        let importId = null;
        try {
          const respuestaCreacion = await fetch('/api/ocr/imports', {
            method: 'POST',
            credentials: 'same-origin',
            headers: {
              'Content-Type': 'application/json',
              'x-csrf-token': csrfToken
            },
            body: JSON.stringify({
              metadata: {
                titulo: datosExamen.titulo.trim() || null,
                año: String(datosExamen.año || '').trim() || null,
                organismo: datosExamen.organismo.trim() || null,
                categoria: datosExamen.categoria.trim() || null
              },
              files: archivosPdf.map(item => ({
                clientId: item.id,
                originalName: item.file.name,
                size: item.file.size,
                mimeType: item.file.type,
                lastModified: item.file.lastModified,
                type: item.tipo
              }))
            })
          });
          const creada = await respuestaCreacion.json().catch(() => ({}));
          if (!respuestaCreacion.ok) throw new Error(creada.message || creada.statusMessage || 'No se pudo crear la importación');
          importId = creada.import.id;

          for (let index = 0; index < creada.uploads.length; index += 1) {
            const uploadInfo = creada.uploads[index];
            const local = archivosPdf.find(item => item.id === uploadInfo.clientId);
            if (!local) throw new Error('No se encontró uno de los archivos seleccionados');
            setMensajeEstado(`Subiendo ${index + 1} de ${creada.uploads.length}: ${local.file.name}`);
            await window.uploadOcr02File({
              pathname: uploadInfo.pathname,
              file: local.file,
              importId,
              fileId: uploadInfo.fileId,
              csrfToken,
              onProgress: percentage => setProgresoSubidaOcr(Math.round(((index + percentage / 100) / creada.uploads.length) * 100))
            });
          }

          const respuestaFinal = await fetch(`/api/ocr/imports/${encodeURIComponent(importId)}/complete`, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'x-csrf-token': csrfToken }
          });
          const finalizada = await respuestaFinal.json().catch(() => ({}));
          if (!respuestaFinal.ok) throw new Error(finalizada.message || finalizada.statusMessage || 'No se pudieron validar los PDF');

          setImportacionOcr(finalizada.import);
          setArchivosPdf([]);
          setDatosExamen({ titulo: '', organismo: '', año: '', categoria: '' });
          setProgresoSubidaOcr(100);
          setMensajeEstado('Lista para procesar');
        } catch (error) {
          if (importId) {
            await fetch(`/api/ocr/imports/${encodeURIComponent(importId)}`, {
              method: 'DELETE',
              credentials: 'same-origin',
              headers: { 'x-csrf-token': csrfToken }
            }).catch(() => undefined);
          }
          setErrorArchivosPdf(error.message || 'No se pudo completar la subida privada.');
          setMensajeEstado('');
        } finally {
          setSubiendoImportacionOcr(false);
        }
      };

      const cancelarImportacionOcr = async () => {
        if (!importacionOcr || !confirm('¿Cancelar esta importación y eliminar todos sus PDF privados?')) return;
        try {
          const respuesta = await fetch(`/api/ocr/imports/${encodeURIComponent(importacionOcr.id)}`, {
            method: 'DELETE',
            credentials: 'same-origin',
            headers: { 'x-csrf-token': csrfToken }
          });
          if (!respuesta.ok) throw new Error('cancel_failed');
          setImportacionOcr(null);
          setExtraccionOcr(null);
          setInterpretacionOcr(null);
          setVinculacionOcr(null);
          setMensajeEstado('');
          setErrorArchivosPdf('');
          setProgresoSubidaOcr(0);
        } catch {
          setErrorArchivosPdf('No se pudo cancelar la importación. Inténtalo de nuevo.');
        }
      };

      const iniciarExtraccionOcr = async () => {
        if (!importacionOcr || importacionOcr.state !== 'lista' || iniciandoExtraccionOcr) return;
        setIniciandoExtraccionOcr(true);
        setErrorArchivosPdf('');
        try {
          const respuesta = await fetch(`/api/ocr/imports/${encodeURIComponent(importacionOcr.id)}/extraction`, {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'x-csrf-token': csrfToken }
          });
          const payload = await respuesta.json().catch(() => ({}));
          if (!respuesta.ok) throw new Error(payload.message || payload.statusMessage || 'No se pudo iniciar la extracción.');
          setExtraccionOcr(payload.extraction || null);
        } catch (error) {
          setErrorArchivosPdf(error.message || 'No se pudo iniciar la extracción documental.');
        } finally {
          setIniciandoExtraccionOcr(false);
        }
      };

      const iniciarInterpretacionOcr = async () => {
        if (!importacionOcr || extraccionOcr?.state !== 'completado' || iniciandoInterpretacionOcr) return;
        setIniciandoInterpretacionOcr(true);
        setErrorArchivosPdf('');
        try {
          const respuesta = await fetch(`/api/ocr/imports/${encodeURIComponent(importacionOcr.id)}/interpretation`, {
            method: 'POST', credentials: 'same-origin', headers: { 'x-csrf-token': csrfToken }
          });
          const payload = await respuesta.json().catch(() => ({}));
          if (!respuesta.ok) throw new Error(payload.message || payload.statusMessage || 'No se pudo iniciar la interpretación.');
          setInterpretacionOcr(payload.interpretation || null);
        } catch (error) {
          setErrorArchivosPdf(error.message || 'No se pudo iniciar la interpretación.');
        } finally {
          setIniciandoInterpretacionOcr(false);
        }
      };

      const iniciarVinculacionOcr = async () => {
        if (!importacionOcr || !['completado', 'revision'].includes(interpretacionOcr?.state) || iniciandoVinculacionOcr) return;
        setIniciandoVinculacionOcr(true);
        setErrorArchivosPdf('');
        try {
          const respuesta = await fetch(`/api/ocr/imports/${encodeURIComponent(importacionOcr.id)}/binding`, {
            method: 'POST', credentials: 'same-origin', headers: { 'x-csrf-token': csrfToken }
          });
          const payload = await respuesta.json().catch(() => ({}));
          if (!respuesta.ok) throw new Error(payload.message || payload.statusMessage || 'No se pudo iniciar la vinculación.');
          setVinculacionOcr(payload.binding || null);
        } catch (error) {
          setErrorArchivosPdf(error.message || 'No se pudo iniciar la vinculación.');
        } finally {
          setIniciandoVinculacionOcr(false);
        }
      };

      const archivoABase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      // =======================================================================
      // PROCESADO CONJUNTO DE ARCHIVOS, OCR SELECTIVO Y REVISIÓN DE CONFLICTOS
      // =======================================================================
      const procesarExamenConVision = async () => {
        if (estadoServicioOcr.status !== 'available') {
          alert("El procesamiento en la nube está pendiente de configuración.");
          return;
        }

        if (archivosPdf.length === 0) {
          alert("Selecciona al menos un PDF del examen.");
          return;
        }

        setProcesandoVision(true);
        setMensajeEstado(`Preparando ${archivosPdf.length} archivo${archivosPdf.length === 1 ? '' : 's'} PDF...`);

        try {
          const archivosCodificados = await Promise.all(archivosPdf.map(async item => ({ ...item, base64: await archivoABase64(item.file) })));

          // Catálogo conciso de los 60 temas
          const catalogoTemasGuia = TEMARIO_OFICIAL_60.map(t => `${t.codigo}: ${t.titulo}`).join('\n');

          const promptInstrucciones = `Analiza conjuntamente todos los PDF como un único examen, sin inventar contenido.

ESTRATEGIA POR PÁGINA:
- Usa primero el texto digital cuando sea válido. Activa OCR solo en páginas con texto insuficiente, estructura rota o baja calidad; en ellas corrige orientación, contraste e inclinación.
- Para casillas, círculos, sombreado, negritas y hojas OMR usa también análisis visual o geométrico.
- Combina todos los archivos antes de vincular preguntas y respuestas.

EXTRACCIÓN:
- Conserva preguntas divididas entre páginas, apartados, bloques, tablas y cualquier número de opciones con sus letras.
- Distingue siempre sección "ordinaria" y "reserva", incluso si la numeración se reinicia.
- Detecta plantillas en tablas, PDF separado o al final, marcas visuales, OMR, negrita y filas anuladas.
- Vincula cada respuesta por número Y sección. Deduplica referencias repetidas, pero nunca mezcles una ordinaria con una reserva del mismo número.
- Usa en respuesta_correcta una sola letra minúscula cuando sea inequívoca, o null en cualquier otro caso.
- Si hay marcas incompatibles, ausencia de respuesta o baja confianza, deja respuesta_correcta en null y registra el conflicto. No adivines.
- Incluye nombre de archivo y página para la pregunta y para la respuesta.
- Asigna tema_codigo solo si procede, usando este catálogo: ${catalogoTemasGuia}

Devuelve ÚNICAMENTE un objeto JSON válido, sin markdown, con esta forma:
{
  "archivos": [{"nombre":"archivo.pdf","tipo_detectado":"preguntas|respuestas|mixto|anexo","paginas":1,"estrategias":[{"pagina":1,"metodo":"texto|ocr|visual","confianza":0.9}]}],
  "preguntas": [{
    "numero":1,"seccion":"ordinaria|reserva","tema_codigo":"ESP-01","enunciado":"...","apartados":[],"tabla_enunciado":"",
    "opciones":[{"letra":"A","texto":"...","tabla":""}],"respuesta_correcta":null,"anulada":false,
    "estado_respuesta":"vinculada|sin_respuesta|conflicto|anulada",
    "procedencias_pregunta":[{"archivo":"archivo.pdf","pagina":1,"pagina_fin":1}],
    "procedencias_respuesta":[{"archivo":"plantilla.pdf","pagina":1}],"conflicto":null
  }],
  "conflictos":[{"tipo":"...","numero":1,"seccion":"ordinaria","detalle":"...","procedencias":[]}]
}`;

          const partesArchivos = archivosCodificados.flatMap((item, idx) => [
            { text: `ARCHIVO ${idx + 1}: ${item.file.name}. Tipo indicado por el usuario: ${item.tipo}.` },
            { inlineData: { mimeType: 'application/pdf', data: item.base64 } }
          ]);

          const payload = {
            contents: [
              {
                parts: [{ text: promptInstrucciones }, ...partesArchivos]
              }
            ],
            generationConfig: {
              responseMimeType: "application/json",
              maxOutputTokens: 32768
            }
          };

          let resultadoNormalizado = null;
          let errorFinal = "";

          try {
            setMensajeEstado(`Analizando conjuntamente ${archivosPdf.length} archivo${archivosPdf.length === 1 ? '' : 's'} en el servidor...`);
            const respuesta = await fetch('/api/ocr/gemini', {
              method: 'POST',
              credentials: 'same-origin',
              headers: {
                'Content-Type': 'application/json',
                'x-csrf-token': csrfToken
              },
              body: JSON.stringify(payload)
            });

            if (!respuesta.ok) {
              errorFinal = `Servicio no disponible (HTTP ${respuesta.status})`;
            } else {
              const resultadoJson = await respuesta.json();
              const textoRespuesta = resultadoJson.candidates?.[0]?.content?.parts?.[0]?.text;
              if (textoRespuesta) {
                const parsed = repararJsonImportacion(textoRespuesta);
                const normalizado = normalizarResultadoImportacion(parsed, archivosPdf);
                if (normalizado.preguntas.length > 0) resultadoNormalizado = normalizado;
              }
            }
          } catch (errLoop) {
            errorFinal = errLoop.message;
          }

          if (!resultadoNormalizado) {
            throw new Error(errorFinal || "No se pudieron extraer preguntas con los modelos disponibles.");
          }

          const resumen = calcularResumenImportacion(resultadoNormalizado.preguntas, resultadoNormalizado, archivosPdf);
          setResultadoImportacion(resultadoNormalizado);
          setPreguntasExtraidas(resultadoNormalizado.preguntas);
          setMensajeEstado(`Completado: ${resumen.ordinarias} ordinarias, ${resumen.reservas} de reserva, ${resumen.respuestasVinculadas} respuestas vinculadas y ${resumen.conflictos} conflictos.`);
        } catch (err) {
          console.error("Error en extracción:", err);
          alert("Error procesando los PDF: " + err.message);
          setMensajeEstado("");
        } finally {
          setProcesandoVision(false);
        }
      };

      const guardarExamenCompletoEnSupabase = async () => {
        if (preguntasExtraidas.length === 0) {
          alert("No hay preguntas extraídas para guardar.");
          return;
        }

        setGuardandoEnSupabase(true);
        try {
          const añoLimpio = String(datosExamen.año || '').trim();
          const año = añoLimpio ? Number.parseInt(añoLimpio, 10) : null;
          const titulo = datosExamen.titulo.trim() || 'Sin especificar';
          const examenCreado = await ExamenService.crearExamen({
            titulo,
            organismo: datosExamen.organismo.trim() || 'Sin especificar',
            año: Number.isFinite(año) ? año : null,
            categoria: datosExamen.categoria.trim() || 'Sin especificar'
          });

          const preguntasParaInsertar = preguntasExtraidas.map(p => {
            const opcion = letra => {
              const encontrada = p.opciones.find(item => item.letra.toLowerCase() === letra);
              return encontrada ? `${encontrada.texto}${encontrada.tabla ? `\n${encontrada.tabla}` : ''}` : '';
            };
            const contenidoAdicional = [
              p.apartados.length ? `Apartados:\n${p.apartados.join('\n')}` : '',
              p.tabla_enunciado ? `Tabla del enunciado:\n${p.tabla_enunciado}` : '',
              p.opciones.filter(item => !['A', 'B', 'C', 'D'].includes(item.letra)).map(item => `${item.letra}) ${item.texto}${item.tabla ? `\n${item.tabla}` : ''}`).join('\n')
            ].filter(Boolean).join('\n\n');
            const trazabilidad = [
              `Sección: ${p.seccion}. Número original: ${p.numero}.`,
              `Pregunta: ${formatearProcedencia(p.procedencias_pregunta) || 'sin procedencia detectada'}.`,
              `Respuesta: ${formatearProcedencia(p.procedencias_respuesta) || 'sin procedencia detectada'}.`,
              p.conflicto ? `Conflicto: ${typeof p.conflicto === 'string' ? p.conflicto : JSON.stringify(p.conflicto)}.` : ''
            ].filter(Boolean).join(' ');
            return {
              examen_id: examenCreado.id,
              tema_codigo: p.tema_codigo || 'ESP-01',
              enunciado: `${p.enunciado}${contenidoAdicional ? `\n\n${contenidoAdicional}` : ''}`,
              opcion_a: opcion('a'),
              opcion_b: opcion('b'),
              opcion_c: opcion('c'),
              opcion_d: opcion('d'),
              respuesta_correcta: p.anulada ? null : (p.respuesta_correcta || null),
              justificacion: trazabilidad,
              origen: formatearProcedencia(p.procedencias_pregunta) || 'Sin especificar',
              año: Number.isFinite(año) ? año : null,
              anulada: Boolean(p.anulada)
            };
          });

          await ExamenService.crearLotePreguntas(preguntasParaInsertar);

          alert(`Examen "${titulo}" guardado con ${preguntasParaInsertar.length} preguntas.`);

          setPreguntasExtraidas([]);
          setResultadoImportacion(null);
          setArchivosPdf([]);
          setDatosExamen({ titulo: '', organismo: '', año: '', categoria: '' });
          setMensajeEstado("");
          await recargarExamenes();
          setModuloActivo("oficiales");
        } catch (e) {
          alert("Error guardando en Supabase: " + e.message);
        } finally {
          setGuardandoEnSupabase(false);
        }
      };

      // =======================================================================
      // SALA DE EXAMEN
      // =======================================================================
      const abrirConfiguracionTest = (examen) => {
        const totalDisponible = Number(examen.preguntas?.[0]?.count) || 0;
        if (totalDisponible < 1) {
          alert(`El examen "${examen.titulo}" no contiene preguntas todavía.`);
          return;
        }
        setExamenParaConfigurar({ ...examen, totalDisponible });
        setConfigTest({
          cantidad: String(Math.min(10, totalDisponible)),
          modo: 'practica',
          conPenalizacion: false,
          penalizacion: '0.33',
          duracionMinutos: '45'
        });
        setErrorConfigTest('');
      };

      const iniciarTestConfigurado = async (e) => {
        e.preventDefault();
        if (!examenParaConfigurar || iniciandoTest) return;

        const cantidad = Number(configTest.cantidad);
        const duracionMinutos = Number(String(configTest.duracionMinutos).replace(',', '.'));
        const penalizacion = configTest.conPenalizacion
          ? Number(String(configTest.penalizacion).replace(',', '.'))
          : 0;

        if (!Number.isInteger(cantidad) || cantidad < 1 || cantidad > examenParaConfigurar.totalDisponible) {
          setErrorConfigTest(`El número de preguntas debe ser un entero entre 1 y ${examenParaConfigurar.totalDisponible}.`);
          return;
        }
        if (configTest.modo === 'simulacro' && (!Number.isFinite(duracionMinutos) || duracionMinutos <= 0)) {
          setErrorConfigTest('La duración del simulacro debe ser mayor que cero.');
          return;
        }
        if (configTest.conPenalizacion && (!Number.isFinite(penalizacion) || penalizacion < 0)) {
          setErrorConfigTest('La penalización debe ser un número igual o mayor que cero.');
          return;
        }

        setIniciandoTest(true);
        setErrorConfigTest('');
        try {
          const raw = await ExamenService.obtenerPreguntasPorExamen(examenParaConfigurar.id);
          const unicas = Array.from(new Map((raw || []).map(p => [p.id, p])).values());
          if (cantidad > unicas.length) {
            setErrorConfigTest(`Solo hay ${unicas.length} preguntas únicas disponibles. Ajusta la cantidad.`);
            return;
          }

          for (let i = unicas.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [unicas[i], unicas[j]] = [unicas[j], unicas[i]];
          }

          const seleccion = unicas.slice(0, cantidad).map((p, idx) => normalizarPregunta(p, idx));
          const iniciadoEn = Date.now();
          const duracionSegundos = configTest.modo === 'simulacro' ? Math.max(1, Math.round(duracionMinutos * 60)) : null;
          const configuracion = {
            modo: configTest.modo,
            penalizacion,
            duracionMinutos: configTest.modo === 'simulacro' ? duracionMinutos : null,
            iniciadoEn,
            finalizaEn: duracionSegundos ? iniciadoEn + (duracionSegundos * 1000) : null,
            persistir: true
          };
          const intento = {
            titulo: examenParaConfigurar.titulo,
            preguntas: seleccion,
            indicePregunta: 0,
            respuestas: {},
            segundos: configTest.modo === 'simulacro' ? duracionSegundos : 0,
            corregido: false,
            configuracion
          };

          localStorage.setItem(CLAVE_INTENTO_OFICIAL, JSON.stringify(intento));
          setPreguntasTest(seleccion);
          setTituloExamenActivo(examenParaConfigurar.titulo);
          setIndicePregunta(0);
          setRespuestas({});
          setSegundos(intento.segundos);
          setConfiguracionIntento(configuracion);
          setExamenCorregido(false);
          setExamenParaConfigurar(null);
          setExamenActivo(true);
        } catch (err) {
          setErrorConfigTest("Error cargando las preguntas del examen: " + err.message);
        } finally {
          setIniciandoTest(false);
        }
      };

      const salirDelTest = () => {
        if (!examenCorregido && !confirm('¿Salir y descartar este intento?')) return;
        localStorage.removeItem(CLAVE_INTENTO_OFICIAL);
        setExamenActivo(false);
        setMostrarEvidencia(false);
        setConfiguracionIntento({
          modo: 'simulacro',
          penalizacion: 0.33,
          duracionMinutos: null,
          iniciadoEn: null,
          finalizaEn: null,
          persistir: false
        });
      };

      const lanzarExamenBD = async (examen) => {
        try {
          const raw = await ExamenService.obtenerPreguntasPorExamen(examen.id);
          if (!raw || raw.length === 0) {
            alert(`El examen "${examen.titulo}" no contiene preguntas todavía.`);
            return;
          }
          const normalizadas = raw.map((p, idx) => normalizarPregunta(p, idx));
          setPreguntasTest(normalizadas);
          setTituloExamenActivo(examen.titulo);
          setIndicePregunta(0);
          setRespuestas({});
          setSegundos(normalizadas.length * 90);
          setConfiguracionIntento({
            modo: 'simulacro',
            penalizacion: 0.33,
            duracionMinutos: normalizadas.length * 1.5,
            iniciadoEn: null,
            finalizaEn: null,
            persistir: false
          });
          setExamenCorregido(false);
          setExamenActivo(true);
        } catch (err) {
          alert("Error cargando preguntas del examen: " + err.message);
        }
      };

      async function finalizarYRegistrarExamen() {
        if (examenCorregido || finalizandoExamenRef.current) return;
        finalizandoExamenRef.current = true;
        setExamenCorregido(true);

        let aciertos = 0;
        let fallos = 0;
        let blancos = 0;

        const detalles = preguntasTest.map(p => {
          const resp = respuestas[p.id];
          const seleccion = resp?.letra?.toLowerCase() || null;
          const esCorrecta = seleccion === p.respuesta_correcta;

          if (!seleccion) blancos++;
          else if (esCorrecta) aciertos++;
          else fallos++;

          return {
            pregunta_id: p.id,
            opcion_seleccionada: seleccion,
            es_correcta: esCorrecta,
            marcada_duda: resp?.dudosa || false
          };
        });

        const descuento = fallos * configuracionIntento.penalizacion;
        const neta = Number((aciertos - descuento).toFixed(2));
        const tiempoEmpleado = configuracionIntento.persistir && configuracionIntento.modo === 'simulacro'
          ? Math.max(0, Math.round((configuracionIntento.duracionMinutos * 60) - segundos))
          : segundos;

        try {
          await ExamenService.registrarResultadoExamen({
            tipo_examen: 'oficial',
            total_preguntas: preguntasTest.length,
            aciertos,
            fallos,
            blancos,
            puntuacion_neta: neta,
            tiempo_segundos: tiempoEmpleado
          }, detalles);
          recargarHistorialYFallos();
        } catch (e) {
          console.error("Error al registrar resultado:", e);
        } finally {
          finalizandoExamenRef.current = false;
        }
      }

      useEffect(() => {
        if (!examenActivo || examenCorregido) return;
        const timer = setInterval(() => {
          if (!configuracionIntento.persistir) {
            setSegundos(s => Math.max(0, s - 1));
          } else {
            setSegundos(configuracionIntento.modo === 'practica'
              ? Math.max(0, Math.floor((Date.now() - configuracionIntento.iniciadoEn) / 1000))
              : Math.max(0, Math.ceil((configuracionIntento.finalizaEn - Date.now()) / 1000))
            );
          }
        }, 1000);
        return () => clearInterval(timer);
      }, [examenActivo, examenCorregido, configuracionIntento]);

      useEffect(() => {
        if (examenActivo && !examenCorregido && configuracionIntento.persistir && configuracionIntento.modo === 'simulacro' && segundos === 0) {
          finalizarYRegistrarExamen();
        }
      }, [examenActivo, examenCorregido, configuracionIntento.modo, configuracionIntento.persistir, segundos]);

      // =======================================================================
      // MÉTODOS DE GESTIÓN AVANZADA (GA)
      // =======================================================================
      const cargarPreguntasDeExamenGA = async (examen) => {
        setExamenSeleccionadoGA(examen);
        try {
          const data = await ExamenService.obtenerPreguntasPorExamen(examen.id);
          setPreguntasGA(data);
        } catch (e) {
          alert("Error cargando preguntas: " + e.message);
        }
      };

      const handleBorrarExamenCompleto = async (examenId, titulo) => {
        const confirmar = confirm(`¿ELIMINAR EXAMEN COMPLETO?\n\n"${titulo}"\n\nSe eliminará el examen y TODAS las preguntas asociadas.`);
        if (!confirmar) return;

        try {
          await ExamenService.eliminarExamenCompleto(examenId);
          if (examenSeleccionadoGA?.id === examenId) {
            setExamenSeleccionadoGA(null);
            setPreguntasGA([]);
          }
          await recargarExamenes();
        } catch (err) {
          alert("Error eliminando examen: " + err.message);
        }
      };

      const handleBorrarPreguntaIndividual = async (preguntaId) => {
        if (!confirm("¿Eliminar esta pregunta definitivamente?")) return;
        try {
          await ExamenService.eliminarPregunta(preguntaId);
          setPreguntasGA(prev => prev.filter(p => p.id !== preguntaId));
          await recargarExamenes();
        } catch (err) {
          alert("Error eliminando pregunta: " + err.message);
        }
      };

      const handleGuardarPreguntaEditada = async (e) => {
        e.preventDefault();
        try {
          const guardada = await ExamenService.guardarPregunta(preguntaEnEdicion);
          setPreguntasGA(prev => prev.map(p => p.id === guardada.id ? guardada : p));
          setPreguntaEnEdicion(null);
          await recargarExamenes();
        } catch (err) {
          alert("Error guardando la pregunta: " + err.message);
        }
      };

      const handleCrearExamenNuevo = async (e) => {
        e.preventDefault();
        try {
          const creado = await ExamenService.crearExamen(nuevoExamenForm);
          setModalNuevoExamen(false);
          setNuevoExamenForm({ titulo: "", organismo: "Diputación Provincial de Sevilla", año: 2023, categoria: "Oficial" });
          await recargarExamenes();
          cargarPreguntasDeExamenGA(creado);
        } catch (err) {
          alert("Error creando examen: " + err.message);
        }
      };

      const temasFiltrados = useMemo(() => {
        if (filtroBloque === "todos") return TEMARIO_OFICIAL_60;
        return TEMARIO_OFICIAL_60.filter(t => t.bloque === filtroBloque);
      }, [filtroBloque]);
      const resumenRevision = calcularResumenImportacion(preguntasExtraidas, resultadoImportacion, archivosPdf);

      if (comprobandoSesion) {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
            <p className="text-xs font-semibold text-slate-600">Comprobando sesión segura…</p>
          </div>
        );
      }

      if (!autenticado) {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
            <div className="w-full max-w-[390px] bg-white rounded-3xl p-7 shadow-sm border border-slate-200/80">
              <div className="inline-block px-3 py-1 rounded-full bg-[#E5F5F0] text-[#0F6252] text-[11px] font-bold tracking-wider mb-5">
                ACCESO PRIVADO
              </div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">OposiTest</h1>
              <p className="text-xs text-slate-500 font-medium mt-1 mb-6">
                Ayudante de Archivo y Biblioteca · OEP 2023
              </p>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-800 mb-1.5">Correo electrónico</label>
                  <input
                    type="email"
                    value={emailInput}
                    onChange={(e) => setEmailInput(e.target.value)}
                    required
                    className="w-full bg-[#EEF4FF] border border-[#D5E2FF] focus:border-[#0F6252] rounded-xl px-3.5 py-2.5 text-xs text-slate-900 outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-800 mb-1.5">Contraseña</label>
                  <input
                    type="password"
                    placeholder="••••••••••••"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    required
                    className="w-full bg-[#EEF4FF] border border-[#D5E2FF] focus:border-[#0F6252] rounded-xl px-3.5 py-2.5 text-xs text-slate-900 outline-none"
                  />
                </div>
                {errorAcceso && (
                  <p role="alert" className="text-xs font-semibold text-red-700">{errorAcceso}</p>
                )}
                <button
                  type="submit"
                  disabled={accediendo}
                  className="w-full bg-[#0F6252] hover:bg-[#0c4d40] disabled:opacity-60 text-white font-bold text-xs py-3 rounded-xl transition mt-2 shadow-xs"
                >
                  {accediendo ? 'Validando…' : 'Entrar'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (examenActivo) {
        const p = preguntasTest[indicePregunta] || preguntasTest[0];
        const resp = respuestas[p?.id];

        const responder = (opVal, letra) => {
          if (examenCorregido) return;
          const esMisma = resp?.letra === letra;
          setRespuestas(prev => ({
            ...prev,
            [p.id]: { letra: esMisma ? null : letra, dudosa: resp?.dudosa || false }
          }));
        };

        const toggleDuda = () => {
          setRespuestas(prev => ({
            ...prev,
            [p.id]: { ...resp, dudosa: !resp?.dudosa }
          }));
        };

        const formatTiempo = (s) => {
          const m = Math.floor(s / 60);
          const sec = s % 60;
          return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        };

        let stats = null;
        if (examenCorregido) {
          let ac = 0, fa = 0, bl = 0;
          preguntasTest.forEach(item => {
            const r = respuestas[item.id]?.letra?.toLowerCase();
            if (!r) bl++;
            else if (r === item.respuesta_correcta) ac++;
            else fa++;
          });
          const neta = ac - (fa * configuracionIntento.penalizacion);
          stats = { ac, fa, bl, neta: Number(neta.toFixed(2)) };
        }

        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
            <header className="min-h-12 bg-slate-950 border-b border-slate-800 px-3 sm:px-5 py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
              <button onClick={salirDelTest} className="self-start sm:self-auto text-slate-400 hover:text-white font-semibold">
                ← Volver al panel
              </button>
              <div className="w-full sm:w-auto flex flex-wrap items-center justify-center gap-x-3 gap-y-1">
                <span className="w-full sm:w-auto text-center font-bold text-white truncate max-w-xs">{tituloExamenActivo}</span>
                <span className="font-bold text-slate-200">
                  {Object.values(respuestas).filter(r => r.letra).length}/{preguntasTest.length} respondidas
                </span>
                <span className="text-amber-400 font-semibold">⚑ {Object.values(respuestas).filter(r => r.dudosa).length} dudosas</span>
                <span className={`font-bold ${configuracionIntento.modo === 'simulacro' && segundos <= 60 ? 'text-rose-400' : 'text-slate-200'}`}>
                  {configuracionIntento.modo === 'practica' ? '↑' : '↓'} {formatTiempo(segundos)}
                </span>
              </div>
              <div className="w-full sm:w-auto flex items-center justify-end gap-2">
                <button onClick={() => setMostrarEvidencia(v => !v)} className="px-3 py-1 rounded-lg border border-slate-800 bg-slate-900 text-slate-300 font-semibold hover:bg-slate-800">
                  Evidencia [E]
                </button>
                {!examenCorregido ? (
                  <button onClick={() => confirm("¿Finalizar y corregir el test?") && finalizarYRegistrarExamen()} className="px-3 py-1 rounded-lg bg-[#0F6252] hover:bg-[#0c4d40] text-white font-bold">
                    Finalizar
                  </button>
                ) : (
                  <span className="px-2.5 py-1 rounded-lg bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold text-[11px]">
                    CORREGIDO
                  </span>
                )}
              </div>
            </header>

            <main className="flex-1 max-w-3xl mx-auto w-full p-4 sm:p-6 flex flex-col justify-between">
              <div className="space-y-4">
                <div className="flex justify-between items-center text-xs text-slate-400 font-medium">
                  <div className="flex items-center gap-2">
                    <span className="px-2 py-0.5 rounded bg-slate-800 text-emerald-400 font-bold">{p.tema_codigo}</span>
                    <span>PREGUNTA {indicePregunta + 1} DE {preguntasTest.length}</span>
                  </div>
                  <button onClick={toggleDuda} className="text-amber-400 hover:underline">
                    {resp?.dudosa ? '★ Dudosa marcada' : '☆ Marcar dudosa'}
                  </button>
                </div>
                <h2 className="text-base font-semibold text-white leading-relaxed">{p.enunciado}</h2>
                <div className="space-y-2.5 pt-2">
                  {p.opciones.map(op => {
                    const sel = resp?.letra === op.letra;
                    let cls = 'border-slate-800 bg-slate-950/60 text-slate-300 hover:bg-slate-800/60';
                    if (examenCorregido) {
                      if (op.es_correcta) cls = 'border-emerald-500 bg-emerald-950/50 text-emerald-200 font-bold';
                      else if (sel) cls = 'border-rose-500 bg-rose-950/50 text-rose-200 line-through';
                      else cls = 'opacity-40 border-slate-800 text-slate-500';
                    } else if (sel) {
                      cls = 'border-[#0F6252] bg-[#0F6252]/20 text-white font-semibold ring-1 ring-[#0F6252]';
                    }

                    return (
                      <button
                        key={op.id}
                        onClick={() => responder(op.valor, op.letra)}
                        className={`w-full text-left p-3.5 rounded-xl border text-xs flex items-start gap-3 transition ${cls}`}
                      >
                        <span className="font-bold px-2 py-0.5 bg-slate-800 rounded-lg text-slate-400 text-xs shrink-0">{op.letra}</span>
                        <span className="leading-snug pt-0.5">{op.texto}</span>
                      </button>
                    );
                  })}
                </div>

                {examenCorregido && p.evidencia_texto && (
                  <div className="mt-4 p-4 rounded-xl bg-amber-950/40 border border-amber-800/60 text-amber-200 text-xs leading-relaxed">
                    <span className="font-bold text-amber-400 block mb-1">📖 Justificación:</span>
                    {p.evidencia_texto}
                  </div>
                )}
              </div>

              {examenCorregido && stats && (
                <div className="my-6 bg-slate-950 border border-slate-800 rounded-2xl p-5">
                  <h3 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">Resultado de la prueba</h3>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                    <div className="bg-emerald-950/40 border border-emerald-900/60 p-2.5 rounded-xl">
                      <span className="text-[10px] text-emerald-400 font-bold uppercase">Aciertos (+1)</span>
                      <p className="text-xl font-black text-emerald-300">{stats.ac}</p>
                    </div>
                    <div className="bg-rose-950/40 border border-rose-900/60 p-2.5 rounded-xl">
                      <span className="text-[10px] text-rose-400 font-bold uppercase">Fallos (-{configuracionIntento.penalizacion.toLocaleString('es-ES')})</span>
                      <p className="text-xl font-black text-rose-300">{stats.fa}</p>
                    </div>
                    <div className="bg-slate-900 border border-slate-800 p-2.5 rounded-xl">
                      <span className="text-[10px] text-slate-400 font-bold uppercase">Blancos</span>
                      <p className="text-xl font-black text-slate-300">{stats.bl}</p>
                    </div>
                    <div className="bg-[#0F6252]/20 border border-[#0F6252]/40 p-2.5 rounded-xl">
                      <span className="text-[10px] text-emerald-400 font-bold uppercase">Nota Neta</span>
                      <p className="text-xl font-black text-emerald-400">{stats.neta} / {preguntasTest.length}</p>
                    </div>
                  </div>
                </div>
              )}

              <div className="pt-6 border-t border-slate-800 flex justify-between items-center">
                <button
                  disabled={indicePregunta === 0}
                  onClick={() => setIndicePregunta(i => i - 1)}
                  className="px-4 py-2 rounded-xl border border-slate-800 text-xs font-semibold disabled:opacity-30 hover:bg-slate-800"
                >
                  ← Anterior
                </button>
                <span className="text-xs text-slate-500">{indicePregunta + 1} / {preguntasTest.length}</span>
                <button
                  disabled={indicePregunta === preguntasTest.length - 1}
                  onClick={() => setIndicePregunta(i => i + 1)}
                  className="px-4 py-2 rounded-xl border border-slate-800 text-xs font-semibold disabled:opacity-30 hover:bg-slate-800"
                >
                  Siguiente →
                </button>
              </div>
            </main>

            {mostrarEvidencia && (
              <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                <div className="bg-slate-950 border border-slate-800 max-w-lg w-full p-5 rounded-2xl space-y-3">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span className="text-xs font-bold text-slate-300">EVIDENCIA / FUENTE P.{indicePregunta + 1}</span>
                    <button onClick={() => setMostrarEvidencia(false)} className="text-slate-400 hover:text-white">✕</button>
                  </div>
                  <p className="text-xs text-slate-200 leading-relaxed bg-slate-900 p-3.5 rounded-xl border border-slate-800">
                    {p.evidencia_texto}
                  </p>
                </div>
              </div>
            )}
          </div>
        );
      }

      const navItems = [
        { id: "inicio", sigla: "IN", label: "Inicio" },
        { id: "oficiales", sigla: "OF", label: "Exámenes oficiales" },
        { id: "temario", sigla: "MT", label: "Mi temario" },
        { id: "leyes", sigla: "LE", label: "Leyes y normas" },
        { id: "otros", sigla: "OT", label: "Otros exámenes" },
        { id: "errores", sigla: "RE", label: "Repasar errores" },
        { id: "resultados", sigla: "MR", label: "Mis resultados" },
        { id: "materiales", sigla: "MA", label: "Materiales" },
        { id: "ingesta", sigla: "IN", label: "Incorporar un examen" },
        { id: "gestion", sigla: "GA", label: "Gestión avanzada" },
        { id: "ayuda", sigla: "AY", label: "Ayuda y manual" },
      ];

      return (
        <div className="min-h-screen w-full flex overflow-x-hidden bg-[#F8FAFB] dark:bg-slate-950">

          {menuAbierto && menuSuperpuesto && (
            <div
              className="fixed inset-0 z-40 bg-slate-950/55 backdrop-blur-[1px]"
              onClick={() => cerrarMenu()}
              aria-hidden="true"
            />
          )}

          {menuAbierto && (
            <aside
              id="menu-lateral"
              ref={panelMenuRef}
              role={menuSuperpuesto ? "dialog" : undefined}
              aria-modal={menuSuperpuesto ? "true" : undefined}
              aria-label="Navegación principal"
              onKeyDown={manejarTecladoMenu}
              className={`${menuSuperpuesto ? 'fixed inset-y-0 left-0 z-50 w-[min(18rem,85vw)] shadow-2xl' : 'relative w-56'} bg-white dark:bg-slate-900 border-r border-slate-200/90 dark:border-slate-800 flex flex-col shrink-0`}
            >
              <div className="p-3.5 flex items-center justify-between gap-2.5 border-b border-slate-100 dark:border-slate-800">
                <div className="flex items-center gap-2.5 min-w-0">
                  <div className="w-8 h-8 rounded-xl bg-[#0F6252] text-white flex items-center justify-center font-bold text-xs shrink-0">
                    AB
                  </div>
                  <div className="leading-tight truncate">
                    <div className="font-bold text-xs text-slate-900 dark:text-white truncate">Archivo & Biblioteca</div>
                    <div className="text-[10px] text-slate-400 truncate">Tu espacio de estudio</div>
                  </div>
                </div>
                <button
                  ref={botonCerrarMenuRef}
                  type="button"
                  onClick={() => cerrarMenu()}
                  className="w-8 h-8 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center shrink-0"
                  aria-label="Cerrar menú"
                >
                  ✕
                </button>
              </div>

              <nav className="flex-1 p-2 space-y-0.5 overflow-y-auto">
                {navItems.map(item => {
                  const activo = moduloActivo === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => seleccionarApartado(item.id)}
                      className={`w-full flex items-center gap-2.5 px-2.5 py-2 rounded-xl text-xs font-semibold transition text-left ${
                        activo
