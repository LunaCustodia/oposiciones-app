        if (!supabaseClient) return;

        try {
          const { data: dataCom } = await supabaseClient.storage.from('temario').list('Comunes', { limit: 100 });

          const { data: dataEsp } = await supabaseClient.storage.from('temario').list('Especificos', { limit: 100 });

        } catch (err) {
          console.error("Error al consultar Storage:", err);
        } finally {
          setCargandoArchivos(false);
        }
      }, []);

      useEffect(() => {
        if (autenticado) {
          cargarArchivosStorage();
        }
      }, [autenticado, cargarArchivosStorage]);

      // Función inteligente para emparejar cada tema con su archivo en Supabase Storage
      const obtenerArchivoTema = useCallback((tema) => {
        const lista = tema.bloque === 'Común' ? archivosComunes : archivosEspecificos;
        const numPadded = String(tema.numero).padStart(2, '0'); // "01", "02", ...
        const numSingle = String(tema.numero); // "1", "2", ...

        // Busca coincidencia flexible insensible a mayúsculas
        const encontrado = lista.find(f => {
          const name = f.name.toLowerCase();
          return name.includes(`tema_${numPadded}`) || 
                 name.includes(`tema_${numSingle}_`) ||
                 name.includes(`tema ${numPadded}`) || 
                 name.includes(`tema ${numSingle} `) ||
                 name.startsWith(`tema_${numPadded}`) ||
                 name.startsWith(`tema${numPadded}`);

                    </div>

                    <div className="bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 rounded-3xl p-6 space-y-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 dark:border-slate-800 pb-4">
                        <div>
                          <h2 className="text-base font-extrabold text-slate-900 dark:text-white">
                            Subir examen PDF y revisar antes de activar
                          </h2>
                          <p className="text-xs text-slate-500 mt-0.5">
                            Los originales, huellas, progreso y recortes quedan en almacenamiento privado. El trabajador usa únicamente conexiones HTTPS salientes; ninguna subida activa preguntas.
                          </p>
                        </div>
                        <span className="self-start sm:self-center px-3 py-1 rounded-full border border-amber-400 bg-amber-50/50 text-amber-700 text-xs font-semibold shrink-0">
                          Trabajador local desconectado
                        </span>
                      </div>

                      <div className="p-3.5 rounded-2xl bg-[#FFFBEB] border border-[#FEE685] text-amber-900 text-xs space-y-0.5">
                        <div className="font-bold">Trabajador OCR local no detectado</div>
                        <div className="text-amber-800 text-[11px]">
                          Puedes procesar en esta pestaña. Si la cierras, el trabajo queda guardado hasta que vuelva a abrirse el trabajador o pulses recuperar.
                        </div>
                      </div>

                      <fieldset className="border-2 border-[#0F6252] rounded-2xl p-4 pt-2 space-y-3">
                        <legend className="px-2 font-bold text-slate-900 dark:text-white text-xs">
                          ¿En qué apartado quieres incorporarlo?
                        </legend>

                        <label className="flex items-start gap-3 cursor-pointer">
                          <input
                            type="radio"
                            name="destino"
                            checked={tipoDestino === "oficiales"}
                            onChange={() => setTipoDestino("oficiales")}
                            className="mt-0.5 text-[#0F6252] focus:ring-[#0F6252] w-4 h-4"
                          />
                          <div className="text-xs">
                            <span className="font-bold text-slate-900 dark:text-white">Exámenes oficiales.</span>{' '}
                            <span className="text-slate-600 dark:text-slate-400">Se guardará en este apartado; la procedencia verificada se registra por separado.</span>
                          </div>
                        </label>

                        <label className="flex items-start gap-3 cursor-pointer">
                          <input
                            type="radio"
                            name="destino"
                            checked={tipoDestino === "otros"}
                            onChange={() => setTipoDestino("otros")}
                            className="mt-0.5 text-[#0F6252] focus:ring-[#0F6252] w-4 h-4"
                          />
                          <div className="text-xs">
                            <span className="font-bold text-slate-900 dark:text-white">Otros exámenes.</span>{' '}
                            <span className="text-slate-600 dark:text-slate-400">Para academias, manuales, simulacros, repertorios y cuestionarios no oficiales.</span>
                          </div>
                        </label>
                      </fieldset>

                      <fieldset className="border border-slate-200 dark:border-slate-800 rounded-2xl p-4 pt-2">
                        <legend className="px-2 font-bold text-slate-900 dark:text-white text-xs">
                          Qué quieres hacer
                        </legend>

                        <label className="flex items-start gap-3 cursor-pointer">
                          <input
                            type="radio"
                            name="accion"
                            checked={accionTipo === "nuevo"}
                            onChange={() => setAccionTipo("nuevo")}
                            className="mt-0.5 text-[#0F6252] focus:ring-[#0F6252] w-4 h-4"
                          />
                          <div className="text-xs">
                            <span className="font-bold text-slate-900 dark:text-white">Crear un examen nuevo.</span>{' '}
                            <span className="text-slate-600 dark:text-slate-400">El cuestionario es obligatorio.</span>
                          </div>
                        </label>
                      </fieldset>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                        <div className="border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-center">
                          <span className="text-xs font-bold text-slate-800 dark:text-white block mb-1">Cuestionario en PDF</span>
                          <input type="file" accept=".pdf" className="text-xs text-slate-500 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-[#0F6252] file:text-white file:font-semibold" />
                        </div>
                        <div className="border border-slate-200 dark:border-slate-800 rounded-2xl p-4 text-center">
                          <span className="text-xs font-bold text-slate-800 dark:text-white block mb-1">Plantilla de Soluciones (opcional)</span>
                          <input type="file" accept=".pdf" className="text-xs text-slate-500 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:bg-slate-800 file:text-white file:font-semibold" />
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 4. OFICIALES */}
                {moduloActivo === "oficiales" && (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center">
                      <div>
                        <h2 className="text-lg font-bold text-slate-900 dark:text-white">Exámenes oficiales de convocatorias</h2>
                        <p className="text-xs text-slate-500">Exámenes reales con evidencias recortadas del tribunal original.</p>
                      </div>
                      <button onClick={() => setModuloActivo("ingesta")} className="px-4 py-2 bg-[#0F6252] text-white text-xs font-bold rounded-xl">
                        + Subir nuevo examen PDF
                      </button>
                    </div>

                    <div className="grid gap-3">
                      {EXAMENES_OFICIALES.map(ex => (
                        <div key={ex.id} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 flex items-center justify-between">
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className="font-bold text-xs text-slate-900 dark:text-white">{ex.titulo}</span>
                              <span className="px-2 py-0.5 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 rounded-md text-[10px] font-semibold">{ex.anio}</span>
                            </div>
                            <div className="text-xs text-slate-500 flex gap-3">
                              <span>{ex.preguntas} preguntas</span>
                              <span>•</span>
                              <span>{ex.reservas} de reserva</span>
                              <span>•</span>
                              <span className="text-rose-600 font-semibold">{ex.penalizacion}</span>
                            </div>
                          </div>
                          <button onClick={() => iniciarExamen()} className="px-4 py-2 bg-[#0F6252] hover:bg-[#0c4d40] text-white text-xs font-bold rounded-xl transition">
                            Hacer simulacro →
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 5. LEYES */}
                {moduloActivo === "leyes" && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white">Leyes y Normativa Canónica</h2>
                      <p className="text-xs text-slate-500">Genera test basados en la literalidad de artículos, plazos y competencias.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                      {[
                        { codigo: "Ley 39/2015", alias: "LPACAP", nombre: "Procedimiento Administrativo Común de las Administraciones Públicas", arts: 133 },
                        { codigo: "RDL 5/2015", alias: "TREBEP", nombre: "Texto Refundido de la Ley del Estatuto Básico del Empleado Público", arts: 100 },
                        { codigo: "Ley 7/1985", alias: "LBRL", nombre: "Reguladora de las Bases del Régimen Local", arts: 141 },
                        { codigo: "Constitución 1978", alias: "CE", nombre: "Constitución Española", arts: 169 },
                        { codigo: "Ley 7/2011", alias: "SAA", nombre: "Documentos, Archivos y Patrimonio Documental de Andalucía", arts: 78 },
                        { codigo: "Ley 16/1985", alias: "PHE", nombre: "Patrimonio Histórico Español", arts: 79 }
                      ].map(ley => (
                        <div key={ley.codigo} className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 flex flex-col justify-between">
                          <div>
                            <div className="flex items-center justify-between mb-1.5">
                              <span className="font-bold text-xs text-[#0F6252] dark:text-emerald-400">{ley.codigo}</span>
                              <span className="text-[10px] bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded font-semibold text-slate-600 dark:text-slate-400">{ley.alias}</span>
                            </div>
                            <h4 className="font-bold text-xs text-slate-900 dark:text-white mb-1">{ley.nombre}</h4>
                            <p className="text-xs text-slate-500">{ley.arts} artículos indexados</p>
                          </div>
                          <button onClick={() => iniciarExamen()} className="mt-3.5 w-full py-2 bg-[#0F6252] hover:bg-[#0c4d40] text-white text-xs font-bold rounded-xl transition">
                            Hacer test de esta ley →
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 6. OTROS */}
                {moduloActivo === "otros" && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white">Otros exámenes y academias</h2>
                      <p className="text-xs text-slate-500">Test aportados de academias, manuales y cuestionarios no oficiales.</p>
                    </div>
                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 text-center">
                      <div className="w-10 h-10 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center mx-auto mb-2 font-bold text-xs">OT</div>
                      <h3 className="font-bold text-sm text-slate-900 dark:text-white">Bandeja de otros materiales</h3>
                      <p className="text-xs text-slate-500 max-w-sm mx-auto mt-1 mb-4">Puedes cargar exámenes de editoriales independientes desde la zona de incorporación.</p>
                      <button onClick={() => setModuloActivo("ingesta")} className="px-4 py-2 bg-[#7B1FA2] text-white text-xs font-bold rounded-xl">
                        Subir examen de academia →
                      </button>
                    </div>
                  </div>
                )}

                {/* 7. ERRORES */}
                {moduloActivo === "errores" && (
                  <div className="space-y-4">
                    <div className="flex justify-between items-center">
                      <div>
                        <h2 className="text-lg font-bold text-slate-900 dark:text-white">Cuaderno de errores prioritario</h2>
                        <p className="text-xs text-slate-500">Preguntas falladas en simulacros. Requieren 3 aciertos seguidos para desaparecer.</p>
                      </div>
                      <button onClick={() => iniciarExamen()} className="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl transition">
                        Lanzar test de recuperación →
                      </button>
                    </div>

                    <div className="border border-slate-200 dark:border-slate-800 rounded-2xl bg-white dark:bg-slate-900 overflow-hidden divide-y divide-slate-100 dark:divide-slate-800">
                      {[
                        { id: "e-1", enunciado: "¿Cuál es el plazo para interponer recurso potestativo de reposición si el acto es expreso?", racha: "1/3 aciertos", fallos: 2, origen: "Dip. Sevilla 2023" },
                        { id: "e-2", enunciado: "Las faltas muy graves prescriben según el TREBEP a los:", racha: "0/3 aciertos", fallos: 3, origen: "Tema COM-06" },
                      ].map(err => (
                        <div key={err.id} className="p-4 flex items-start justify-between gap-4">
                          <div className="space-y-1">
                            <span className="text-[10px] font-bold text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded">{err.origen}</span>
                            <h4 className="text-xs font-semibold text-slate-800 dark:text-slate-200">{err.enunciado}</h4>
                            <div className="text-xs flex gap-3 text-slate-500 font-medium">
                              <span className="text-rose-600 font-bold">{err.fallos} fallos acumulados</span>
                              <span>•</span>
                              <span className="text-amber-600 font-bold">Racha: {err.racha}</span>
                            </div>
                          </div>
                          <button onClick={() => iniciarExamen()} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition shrink-0">
                            Practicar
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 8. RESULTADOS */}
                {moduloActivo === "resultados" && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white">Histórico de Resultados y Simulacros</h2>
                      <p className="text-xs text-slate-500">Métricas reales aplicando penalización (-0,33 pts por fallo).</p>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl text-center">
                        <div className="text-2xl font-extrabold text-[#0F6252] dark:text-emerald-400">7,82</div>
                        <div className="text-[10px] text-slate-400 uppercase font-bold mt-0.5">Nota media neta</div>
                      </div>
                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl text-center">
                        <div className="text-2xl font-extrabold text-blue-600">14</div>
                        <div className="text-[10px] text-slate-400 uppercase font-bold mt-0.5">Simulacros hechos</div>
                      </div>
                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl text-center">
                        <div className="text-2xl font-extrabold text-rose-500">2</div>
                        <div className="text-[10px] text-slate-400 uppercase font-bold mt-0.5">Fallos pendientes</div>
                      </div>
                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl text-center">
                        <div className="text-2xl font-extrabold text-slate-700 dark:text-slate-300">82%</div>
                        <div className="text-[10px] text-slate-400 uppercase font-bold mt-0.5">Tasa de acierto</div>
                      </div>
                    </div>

                    <div className="border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden bg-white dark:bg-slate-900">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-500 font-semibold">
                            <th className="p-3">Simulacro</th>
                            <th className="p-3 text-center">Aciertos</th>
                            <th className="p-3 text-center">Fallos</th>
                            <th className="p-3 text-center">En blanco</th>
                            <th className="p-3 text-center">Nota Neta</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                          <tr>
                            <td className="p-3 font-semibold text-slate-800 dark:text-slate-200">Dip. Sevilla 2023 — Intento 1</td>
                            <td className="p-3 text-center text-emerald-600 font-bold">84</td>
                            <td className="p-3 text-center text-rose-500 font-bold">12</td>
                            <td className="p-3 text-center text-slate-400">4</td>
                            <td className="p-3 text-center text-[#0F6252] dark:text-emerald-400 font-extrabold text-sm">8,00</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* 9. GESTIÓN AVANZADA */}
                {moduloActivo === "gestion" && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white">Gestión Avanzada</h2>
                      <p className="text-xs text-slate-500">Mantenimiento de preguntas, borrado masivo y copias de seguridad.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl space-y-2">
                        <h4 className="font-bold text-xs text-slate-900 dark:text-white">Depuración de Banco</h4>
                        <p className="text-xs text-slate-500">Permite eliminar preguntas anuladas o exámenes completos que ya no te interesen.</p>
                        <button onClick={() => alert("Banco optimizado.")} className="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl">
                          Depurar preguntas huérfanas
                        </button>
                      </div>

                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl space-y-2">
                        <h4 className="font-bold text-xs text-slate-900 dark:text-white">Copia de Seguridad</h4>
                        <p className="text-xs text-slate-500">Descarga todo tu histórico de intentos y preguntas en formato JSON.</p>
                        <button onClick={() => alert("Copia descargada.")} className="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl">
                          Exportar base de datos
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* 10. AYUDA */}
                {moduloActivo === "ayuda" && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white">Manual y Atajos de Teclado</h2>
                      <p className="text-xs text-slate-500">Instrucciones para responder a alta velocidad y criterios de puntuación.</p>
                    </div>

                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl space-y-4">
                      <h4 className="font-bold text-xs text-[#0F6252] dark:text-emerald-400">ATAJOS DE TECLADO EN ESCRITORIO</h4>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[A], [B], [C], [D]</span>: Marcar opción
                        </div>
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[D]</span>: Marcar duda
                        </div>
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[E]</span>: Abrir evidencia
                        </div>
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[←] / [→]</span>: Cambiar pregunta
                        </div>
                      </div>

                      <h4 className="font-bold text-xs text-[#0F6252] dark:text-emerald-400 pt-2">FÓRMULA DE PUNTUACIÓN</h4>
                      <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed font-medium">
                        Puntuación Neta = Aciertos - (Fallos × 0,333). Las preguntas dejadas en blanco no restan puntuación.
                      </p>
                    </div>
                  </div>
                )}

              </div>
            </main>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
