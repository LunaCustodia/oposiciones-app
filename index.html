    const EXAMENES_OFICIALES = [
      { id: "of-1", titulo: "Diputación Provincial de Sevilla — Auxiliar de Archivos", anio: 2023, preguntas: 100, reservas: 5, penalizacion: "-0,33 pts" },
      { id: "of-2", titulo: "Ayuntamiento de Sevilla — Ayudante de Biblioteca", anio: 2022, preguntas: 80, reservas: 4, penalizacion: "-0,25 pts" },
      { id: "of-3", titulo: "Diputación Provincial de Córdoba — Técnico Auxiliar Archivo", anio: 2023, preguntas: 90, reservas: 5, penalizacion: "-0,33 pts" },
      { id: "of-4", titulo: "Junta de Andalucía — Cuerpo Auxiliar Administrativo", anio: 2021, preguntas: 105, reservas: 5, penalizacion: "-0,33 pts" }

    const BANCO_PREGUNTAS = [

      },
      {

        opciones: [
          { id: "o5", letra: "A", texto: "Los expedientes deben clasificarse por orden cronológico estricto independientemente del productor.", es_correcta: false },
          { id: "o6", letra: "B", texto: "Los documentos de cada fondo deben mantenerse agrupados sin mezclarse con otros.", es_correcta: true },
          { id: "o7", letra: "C", texto: "Los documentos históricos pasan directamente a expurgo a los 10 años.", es_correcta: false },
          { id: "o8", letra: "D", texto: "Solo se aplica a la documentación generada en soporte papel tradicional.", es_correcta: false }
        ]
      },
      {
        id: "p3",
        origen: "oficial",
        numero_orden: 3,
        enunciado: "Conforme al artículo 33 de la Ley 7/1985 (LBRL), ¿a quién corresponde la presidencia de la Diputación Provincial?",
        evidencia_texto: "Art. 33 LBRL: El Presidente de la Diputación es elegido por los Diputados Provinciales de entre ellos en la sesión constitutiva de la corporación.",
        opciones: [
          { id: "o9", letra: "A", texto: "Es designado directamente por el Delegado del Gobierno en la Comunidad Autónoma.", es_correcta: false },
          { id: "o10", letra: "B", texto: "Es elegido por los Diputados Provinciales de entre ellos en la sesión constitutiva.", es_correcta: true },
          { id: "o11", letra: "C", texto: "Al Alcalde del municipio con mayor censo electoral de la provincia.", es_correcta: false },
          { id: "o12", letra: "D", texto: "Por sufragio universal directo de todos los vecinos de los municipios de la provincia.", es_correcta: false }
        ]
      },
      {
        id: "p4",
        origen: "leyes",
        numero_orden: 4,
        enunciado: "De acuerdo con el Real Decreto Legislativo 5/2015 (TREBEP), las faltas muy graves prescriben a los:",
        evidencia_texto: "Art. 97 TREBEP: Las infracciones muy graves prescribirán a los 3 años, las graves a los 2 años y las leves a los 6 meses.",
        opciones: [
          { id: "o13", letra: "A", texto: "Dos años desde su comisión.", es_correcta: false },
          { id: "o14", letra: "B", texto: "Tres años desde su comisión.", es_correcta: true },
          { id: "o15", letra: "C", texto: "Cuatro años improrrogables.", es_correcta: false },
          { id: "o16", letra: "D", texto: "Seis meses en cualquier caso.", es_correcta: false }
        ]
      }

    // =========================================================================
    // COMPONENTE PRINCIPAL
    // =========================================================================

    function App() {
      const [autenticado, setAutenticado] = useState(() => localStorage.getItem("auth_session") === "true");
      const [emailInput, setEmailInput] = useState(() => localStorage.getItem("auth_email") || "lolixi@icloud.com");
      const [passwordInput, setPasswordInput] = useState("");
      const [moduloActivo, setModuloActivo] = useState("inicio");
      const [modoOscuro, setModoOscuro] = useState(false);

      // Sala de examen
      const [examenActivo, setExamenActivo] = useState(false);
      const [preguntasTest, setPreguntasTest] = useState(BANCO_PREGUNTAS);
      const [indicePregunta, setIndicePregunta] = useState(0);
      const [respuestas, setRespuestas] = useState({});
      const [segundos, setSegundos] = useState(3600);
      const [mostrarEvidencia, setMostrarEvidencia] = useState(false);
      const [examenCorregido, setExamenCorregido] = useState(false);

      // Estado del formulario de incorporación
      const [tipoDestino, setTipoDestino] = useState("oficiales");
      const [accionTipo, setAccionTipo] = useState("nuevo");

      useEffect(() => {
        if (modoOscuro) document.documentElement.classList.add("dark");
        else document.documentElement.classList.remove("dark");
      }, [modoOscuro]);

      const handleLogin = (e) => {
        e.preventDefault();
        setAutenticado(true);
        localStorage.setItem("auth_session", "true");
      };

      const handleLogout = () => {
        setAutenticado(false);
        localStorage.removeItem("auth_session");
        setExamenActivo(false);
      };

      const iniciarExamen = (filtradas = BANCO_PREGUNTAS) => {
        setPreguntasTest(filtradas.length > 0 ? filtradas : BANCO_PREGUNTAS);
        setIndicePregunta(0);
        setRespuestas({});
        setSegundos(3600);
        setExamenCorregido(false);
        setExamenActivo(true);
      };

      // ----------------------------------------------------------------------
      // 1. PANTALLA LOGIN PRIVADO
      // ----------------------------------------------------------------------
      if (!autenticado) {
        return (
          <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
            <div className="w-full max-w-[390px] bg-white rounded-3xl p-7 shadow-sm border border-slate-200/80">
              <div className="inline-block px-3 py-1 rounded-full bg-[#E5F5F0] text-[#0F6252] text-[11px] font-bold tracking-wider mb-5">
                ACCESO PRIVADO
              </div>
              <h1 className="text-2xl font-extrabold text-slate-900 tracking-tight">OposiTest</h1>
              <p className="text-xs text-slate-500 font-medium mt-1 mb-6">
                Ayudante de Archivo y Biblioteca · OEP 2023
              </p>
              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="block text-xs font-semibold text-slate-800 mb-1.5">Correo electrónico</label>
                  <input
                    type="email"
                    value={emailInput}
                    onChange={(e) => setEmailInput(e.target.value)}
                    required
                    className="w-full bg-[#EEF4FF] border border-[#D5E2FF] focus:border-[#E59833] rounded-xl px-3.5 py-2.5 text-xs text-slate-900 outline-none"
                  />
                </div>
                <div>
                  <label className="block text-xs font-semibold text-slate-800 mb-1.5">Contraseña</label>
                  <input
                    type="password"
                    placeholder="••••••••••••"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    required
                    className="w-full bg-[#EEF4FF] border border-[#D5E2FF] focus:border-[#0F6252] rounded-xl px-3.5 py-2.5 text-xs text-slate-900 outline-none"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full bg-[#0F6252] hover:bg-[#0c4d40] text-white font-bold text-xs py-3 rounded-xl transition mt-2 shadow-xs"
                >
                  Entrar
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ----------------------------------------------------------------------
      // 2. SALA DE EXAMEN
      // ----------------------------------------------------------------------
      if (examenActivo) {
        const p = preguntasTest[indicePregunta] || preguntasTest[0];
        const resp = respuestas[p?.id];

        const responder = (opId, letra) => {
          if (examenCorregido) return;
          const esMisma = resp?.opcion_id === opId;
          setRespuestas(prev => ({
            ...prev,
            [p.id]: { opcion_id: esMisma ? null : opId, letra: esMisma ? null : letra, dudosa: resp?.dudosa || false }
          }));
        };

        const toggleDuda = () => {
          setRespuestas(prev => ({
            ...prev,
            [p.id]: { ...resp, dudosa: !resp?.dudosa }
          }));
        };

        const formatTiempo = (s) => {
          const m = Math.floor(s / 60);
          const sec = s % 60;
          return `${m.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        };

        return (
          <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col font-sans">
            <header className="h-12 bg-slate-950 border-b border-slate-800 px-5 flex items-center justify-between text-xs">
              <button onClick={() => setExamenActivo(false)} className="text-slate-400 hover:text-white font-semibold">
                ← Volver al panel
              </button>
              <div className="flex items-center gap-4">
                <span className="font-bold text-slate-200">{Object.values(respuestas).filter(r => r.opcion_id).length}/{preguntasTest.length} respondidas</span>
                <span className="text-slate-700">|</span>
                <span className="text-amber-400 font-semibold">⚑ {Object.values(respuestas).filter(r => r.dudosa).length} dudosas</span>
                <span className="text-slate-700">|</span>
                <span className="text-slate-200 font-bold">{formatTiempo(segundos)}</span>
              </div>
              <div className="flex items-center gap-2">
                <button onClick={() => setMostrarEvidencia(v => !v)} className="px-3 py-1 rounded-lg border border-slate-800 bg-slate-900 text-slate-300 font-semibold hover:bg-slate-800">
                  Evidencia [E]
                </button>
                {!examenCorregido ? (
                  <button onClick={() => confirm("¿Finalizar y corregir?") && setExamenCorregido(true)} className="px-3 py-1 rounded-lg bg-[#0F6252] hover:bg-[#0c4d40] text-white font-bold">
                    Finalizar
                  </button>
                ) : (
                  <span className="px-2.5 py-1 rounded-lg bg-emerald-950 text-emerald-400 border border-emerald-800 font-bold text-[11px]">
                    CORREGIDO
                  </span>
                )}
              </div>
            </header>

            <main className="flex-1 max-w-3xl mx-auto w-full p-6 flex flex-col justify-between">
              <div className="space-y-4">
                <div className="flex justify-between items-center text-xs text-slate-400 font-medium">
                  <span>PREGUNTA {p.numero_orden} DE {preguntasTest.length}</span>
                  <button onClick={toggleDuda} className="text-amber-400 hover:underline">
                    {resp?.dudosa ? '★ Dudosa marcada' : '☆ Marcar dudosa'}
                  </button>
                </div>
                <h2 className="text-base font-semibold text-white leading-relaxed">{p.enunciado}</h2>
                <div className="space-y-2.5 pt-2">
                  {p.opciones.map(op => {
                    const sel = resp?.opcion_id === op.id;
                    let cls = 'border-slate-800 bg-slate-950/60 text-slate-300 hover:bg-slate-800/60';
                    if (examenCorregido) {
                      if (op.es_correcta) cls = 'border-emerald-500 bg-emerald-950/40 text-emerald-200 font-bold';
                      else if (sel) cls = 'border-rose-500 bg-rose-950/40 text-rose-200 line-through';
                    } else if (sel) {
                      cls = 'border-[#0F6252] bg-[#0F6252]/20 text-white font-semibold';
                    }

                    return (
                      <button
                        key={op.id}
                        onClick={() => responder(op.id, op.letra)}
                        className={`w-full text-left p-3 rounded-xl border text-xs flex items-start gap-3 transition ${cls}`}
                      >
                        <span className="font-bold px-2 py-0.5 bg-slate-800 rounded-lg text-slate-400 text-xs shrink-0">{op.letra}</span>
                        <span className="leading-snug pt-0.5">{op.texto}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="pt-6 border-t border-slate-800 flex justify-between items-center">
                <button
                  disabled={indicePregunta === 0}
                  onClick={() => setIndicePregunta(i => i - 1)}
                  className="px-4 py-2 rounded-xl border border-slate-800 text-xs font-semibold disabled:opacity-30"
                >
                  ← Anterior
                </button>
                <span className="text-xs text-slate-500">{indicePregunta + 1} / {preguntasTest.length}</span>
                <button
                  disabled={indicePregunta === preguntasTest.length - 1}
                  onClick={() => setIndicePregunta(i => i + 1)}
                  className="px-4 py-2 rounded-xl border border-slate-800 text-xs font-semibold disabled:opacity-30"
                >
                  Siguiente →
                </button>
              </div>
            </main>

            {mostrarEvidencia && (
              <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
                <div className="bg-slate-950 border border-slate-800 max-w-lg w-full p-5 rounded-2xl space-y-3">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                    <span className="text-xs font-bold text-slate-300">EVIDENCIA / FUENTE P.{p.numero_orden}</span>
                    <button onClick={() => setMostrarEvidencia(false)} className="text-slate-400">✕</button>
                  </div>
                  <p className="text-xs text-slate-200 leading-relaxed bg-slate-900 p-3.5 rounded-xl border border-slate-800">
                    {p.evidencia_texto}
                  </p>
                </div>
              </div>
            )}
          </div>
        );
      }

      // ----------------------------------------------------------------------
      // 3. NAVEGACIÓN Y PANELES
      // ----------------------------------------------------------------------
      const navItems = [
        { id: "inicio", sigla: "IN", label: "Inicio" },
        { id: "oficiales", sigla: "OF", label: "Exámenes oficiales" },
        { id: "temario", sigla: "MT", label: "Mi temario" },
        { id: "leyes", sigla: "LE", label: "Leyes y normas" },
        { id: "otros", sigla: "OT", label: "Otros exámenes" },
        { id: "errores", sigla: "RE", label: "Repasar errores" },
        { id: "resultados", sigla: "MR", label: "Mis resultados" },
        { id: "materiales", sigla: "MA", label: "Materiales" },
        { id: "ingesta", sigla: "IN", label: "Incorporar un examen" },
        { id: "gestion", sigla: "GA", label: "Gestión avanzada" },
        { id: "ayuda", sigla: "AY", label: "Ayuda y manual" },
      ];

      return (
        <div className="min-h-screen flex bg-[#F8FAFB] dark:bg-slate-950">
          
          {/* SIDEBAR */}
          <aside className="w-56 bg-white dark:bg-slate-900 border-r border-slate-200/90 dark:border-slate-800 flex flex-col shrink-0">
            <div className="p-3.5 flex items-center gap-2.5 border-b border-slate-100 dark:border-slate-800">
              <div className="w-8 h-8 rounded-xl bg-[#0F6252] text-white flex items-center justify-center font-bold text-xs shrink-0">
                AB
              </div>
              <div className="leading-tight truncate">
                <div className="font-bold text-xs text-slate-900 dark:text-white truncate">Archivo & Biblioteca</div>
                <div className="text-[10px] text-slate-400 truncate">Tu espacio de estudio</div>
              </div>
            </div>

            <nav className="flex-1 p-2 space-y-0.5 overflow-y-auto">
              {navItems.map(item => {
                const activo = moduloActivo === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setModuloActivo(item.id)}
                    className={`w-full flex items-center gap-2.5 px-2.5 py-2 rounded-xl text-xs font-semibold transition text-left ${
                      activo
                        ? 'bg-[#EBF7F4] text-[#0F6252] dark:bg-[#0F6252]/20 dark:text-emerald-300'
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100/80 dark:hover:bg-slate-800/60'

                            </div>
                          </div>
                          <button onClick={() => iniciarExamen()} className="px-3 py-1.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl transition shrink-0">
                            Practicar
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* 9. RESULTADOS */}
                {moduloActivo === "resultados" && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white">Histórico de Resultados y Simulacros</h2>
                      <p className="text-xs text-slate-500">Métricas reales aplicando penalización (-0,33 pts por fallo).</p>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl text-center">
                        <div className="text-2xl font-extrabold text-[#0F6252] dark:text-emerald-400">7,82</div>
                        <div className="text-[10px] text-slate-400 uppercase font-bold mt-0.5">Nota media neta</div>
                      </div>
                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl text-center">
                        <div className="text-2xl font-extrabold text-blue-600">14</div>
                        <div className="text-[10px] text-slate-400 uppercase font-bold mt-0.5">Simulacros hechos</div>
                      </div>
                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl text-center">
                        <div className="text-2xl font-extrabold text-rose-500">2</div>
                        <div className="text-[10px] text-slate-400 uppercase font-bold mt-0.5">Fallos pendientes</div>
                      </div>
                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl text-center">
                        <div className="text-2xl font-extrabold text-slate-700 dark:text-slate-300">82%</div>
                        <div className="text-[10px] text-slate-400 uppercase font-bold mt-0.5">Tasa de acierto</div>
                      </div>
                    </div>

                    <div className="border border-slate-200 dark:border-slate-800 rounded-2xl overflow-hidden bg-white dark:bg-slate-900">
                      <table className="w-full text-left border-collapse text-xs">
                        <thead>
                          <tr className="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-slate-500 font-semibold">
                            <th className="p-3">Simulacro</th>
                            <th className="p-3 text-center">Aciertos</th>
                            <th className="p-3 text-center">Fallos</th>
                            <th className="p-3 text-center">En blanco</th>
                            <th className="p-3 text-center">Nota Neta</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-medium">
                          <tr>
                            <td className="p-3 font-semibold text-slate-800 dark:text-slate-200">Dip. Sevilla 2023 — Intento 1</td>
                            <td className="p-3 text-center text-emerald-600 font-bold">84</td>
                            <td className="p-3 text-center text-rose-500 font-bold">12</td>
                            <td className="p-3 text-center text-slate-400">4</td>
                            <td className="p-3 text-center text-[#0F6252] dark:text-emerald-400 font-extrabold text-sm">8,00</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>
                  </div>
                )}

                {/* 10. GESTIÓN AVANZADA */}
                {moduloActivo === "gestion" && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white">Gestión Avanzada</h2>
                      <p className="text-xs text-slate-500">Mantenimiento de preguntas, borrado masivo y copias de seguridad.</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl space-y-2">
                        <h4 className="font-bold text-xs text-slate-900 dark:text-white">Depuración de Banco</h4>
                        <p className="text-xs text-slate-500">Permite eliminar preguntas anuladas o exámenes completos que ya no te interesen.</p>
                        <button onClick={() => alert("Banco optimizado.")} className="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl">
                          Depurar preguntas huérfanas
                        </button>
                      </div>

                      <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl space-y-2">
                        <h4 className="font-bold text-xs text-slate-900 dark:text-white">Copia de Seguridad</h4>
                        <p className="text-xs text-slate-500">Descarga todo tu histórico de intentos y preguntas en formato JSON.</p>
                        <button onClick={() => alert("Copia descargada.")} className="px-4 py-2 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-200 text-xs font-bold rounded-xl">
                          Exportar base de datos
                        </button>
                      </div>
                    </div>
                  </div>
                )}

                {/* 11. AYUDA */}
                {moduloActivo === "ayuda" && (
                  <div className="space-y-4">
                    <div>
                      <h2 className="text-lg font-bold text-slate-900 dark:text-white">Manual y Atajos de Teclado</h2>
                      <p className="text-xs text-slate-500">Instrucciones para responder a alta velocidad y criterios de puntuación.</p>
                    </div>

                    <div className="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl space-y-4">
                      <h4 className="font-bold text-xs text-[#0F6252] dark:text-emerald-400">ATAJOS DE TECLADO EN ESCRITORIO</h4>
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[A], [B], [C], [D]</span>: Marcar opción
                        </div>
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[D]</span>: Marcar duda
                        </div>
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[E]</span>: Abrir evidencia
                        </div>
                        <div className="p-3 border border-slate-100 dark:border-slate-800 rounded-xl bg-slate-50 dark:bg-slate-950">
                          <span className="font-bold text-slate-900 dark:text-white">[←] / [→]</span>: Cambiar pregunta
                        </div>
                      </div>

                      <h4 className="font-bold text-xs text-[#0F6252] dark:text-emerald-400 pt-2">FÓRMULA DE PUNTUACIÓN</h4>
                      <p className="text-xs text-slate-600 dark:text-slate-400 leading-relaxed font-medium">
                        Puntuación Neta = Aciertos - (Fallos × 0,333). Las preguntas dejadas en blanco no restan puntuación.
                      </p>
                    </div>
                  </div>
                )}

              </div>
            </main>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
